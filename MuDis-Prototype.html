name:"Aphex Twin",real:"Richard David James",pic:"assets/artists-or-bands/aphex-twin.jpg",
facts:[["Born","18 August 1971, Limerick, Ireland"],["Raised","Cornwall, England"],["Active","1988–present"],["Labels","Warp, Rephlex, Apollo, R&S"],["Also known as","AFX, Caustic Window, Polygon Window, The Tuss, Bradley Strider and more"]],
genres:{n:"Electronic",c:[{n:"Techno",c:[{n:"Ambient techno"}]},{n:"Ambient"},{n:"IDM"},{n:"Jungle",c:[{n:"Drill ’n’ bass"}]}]},
bio:["Aphex Twin is the best-known alias of Richard David James, an electronic musician born in Limerick, Ireland, in 1971 to Welsh parents and raised in Cornwall, England. He bought his first synthesizer at 12 and started making music at 14.","He studied engineering at Cornwall College from 1988 to 1990. In 1991 he co-founded Rephlex Records with Grant Wilson-Claridge, and his debut album, Selected Ambient Works 85–92, came out on Apollo in 1992.","On Warp Records he went on to release Selected Ambient Works Volume II (1994), …I Care Because You Do (1995), Richard D. James Album (1996) and Drukqs (2001), and became one of the most influential names in ambient techno and IDM. After a long break, Syro (2014) won the Grammy Award for Best Dance/Electronica Album."],
trivia:["The Aphex Twin logo was designed by Paul Nicholson in 1991.","He reportedly won £50 at age 11 in a competition for making sounds on a Sinclair ZX81, though Fact magazine questioned the story in 2017.","In the 1990s he bought a 1950s Ferret armoured car.","In a 2001 interview he claimed to own the steel structure in the middle of Elephant and Castle, London. It is really the Michael Faraday Memorial, which houses an Underground electricity substation.","Chris Cunningham directed his videos for “Come to Daddy” and “Windowlicker”, which paste James’s face onto other people’s bodies.","Chapel Porth, a beach in Cornwall, is on the cover of Surfing on Sine Waves (1993), released under the name Polygon Window.","He won the Prix Ars Electronica award for digital music in 1999."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Aphex_Twin">Wikipedia: Aphex Twin</a>, available under CC BY-SA 4.0.'
},
"kraftwerk":{
name:"Kraftwerk",real:"Founded by Ralf Hütter and Florian Schneider",pic:"assets/artists-or-bands/kraftwerk.jpg",
facts:[["Formed","1970, Düsseldorf, West Germany"],["Active","1970–present"],["Name means","“Power plant” in German"],["Classic line-up","Ralf Hütter, Florian Schneider, Wolfgang Flür, Karl Bartos"],["Labels","Kling Klang, EMI, Capitol, Warner Bros. and more"]],
genres:{n:"Electronic",c:[{n:"Synth-pop"},{n:"Krautrock"}]},
bio:["Kraftwerk, German for “power plant”, was formed in Düsseldorf in 1970 by Ralf Hütter and Florian Schneider, who had met as music students. They began in the experimental krautrock scene, making free-form instrumental albums on flute, organ and violin run through electronic effects.","With Autobahn (1974), a top-five album in the US, they traded improvisation for synthesizers, drum machines and vocoders. Wolfgang Flür and Karl Bartos joined to complete the classic four-man line-up, and Trans-Europe Express, The Man-Machine and Computer World defined what the band called “robot pop”: catchy melodies, sparse arrangements and lyrics about cars, trains and computers.","Flür left in 1987 and Bartos in 1990; Schneider left in 2008 and died in 2020. Led by Hütter, the band still tours. Their sound runs through synth-pop, hip hop, techno and house, and they received a Grammy Lifetime Achievement Award in 2014 and joined the Rock & Roll Hall of Fame in 2021."],
trivia:["“The Model” started life as a B-side, but radio DJs preferred it, and the reissued single reached number one in the UK.","They did not own a computer while recording Computer World.","For the Computer World tour they packed up their entire Kling Klang studio and took it on the road, with mannequins of themselves performing “The Robots”.","Their studio phone had no ringer. Callers were told to ring at an exact time, and Hütter would answer without ever hearing it ring.","When Coldplay asked to borrow the melody of “Computer Love”, the band sent back a handwritten note that simply said “yes”.","In 2018, astronaut Alexander Gerst played “Spacelab” with them live from the International Space Station.","David Bowie’s “V-2 Schneider” is a tribute to Florian Schneider."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Kraftwerk">Wikipedia: Kraftwerk</a>, available under CC BY-SA 4.0.'
},
"giorgio-moroder":{
name:"Giorgio Moroder",real:"Giovanni Giorgio Moroder",pic:"assets/artists-or-bands/giorgio-moroder.jpg",
facts:[["Born","26 April 1940, Urtijëi, South Tyrol, Italy"],["Active","1958–present"],["Known as","The Father of Disco"],["Labels","Oasis, Casablanca, Hansa, RCA, Virgin and more"],["Awards","3 Academy Awards, 4 Grammys, 4 Golden Globes"]],
genres:{n:"Electronic",c:[{n:"Euro disco"}]},
bio:["Giorgio Moroder was born in 1940 in Urtijëi, South Tyrol, and grew up speaking Ladin, Italian and German. He taught himself guitar at 15, was touring Europe as a musician by 18, and released his first singles in Berlin under the name Giorgio before moving to Munich in 1968.","In Munich he founded Musicland Studios and first used a Moog synthesizer in 1972. With lyricist Pete Bellotte he produced Donna Summer’s run of disco hits, including “I Feel Love” in 1977. His synthesizer work fed into hi-NRG, Italo disco, synth-pop, house and techno, earning him the title Father of Disco.","He went on to film, winning Oscars for the Midnight Express score, “Flashdance... What a Feeling” and Top Gun’s “Take My Breath Away”, the work he says he is proudest of. After two decades without a new album, he returned on Daft Punk’s Random Access Memories in 2013 and has since worked with Kylie Minogue, Duran Duran and The Weeknd."],
trivia:["His 1969 tune “Doo-Bee-Doo-Bee-Doo” played for years in silent sketches on The Benny Hill Show.","His song “Tears” is the basis of DJ Shadow’s “Organ Donor” on Endtroducing.....","He co-designed a supercar, the Cizeta-Moroder V16T.","In 1984 he restored and re-edited the 1927 silent film Metropolis with a new pop soundtrack, splitting film critics down the middle.","Visiting a Hollywood club named after him in 2013, he said it was the first time he had seen people dance to his music, because he had always been in the studio.","He wrote “Un’estate italiana”, the official song of the 1990 FIFA World Cup.","He donated his 13 platinum discs for Flashdance to the museum in his hometown."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Giorgio_Moroder">Wikipedia: Giorgio Moroder</a>, available under CC BY-SA 4.0. Photo: Andy Witchger, <a href="https://commons.wikimedia.org/wiki/File:Giorgio_Moroder_-_First_Avenue_Minneapolis_-_The_Current_(44776142702).jpg">Wikimedia Commons</a>, CC BY 2.0.'
},
"daft-punk":{
name:"Daft Punk",real:"Thomas Bangalter and Guy-Manuel de Homem-Christo",pic:"assets/artists-or-bands/daft-punk.jpg",
facts:[["Formed","1993, Paris, France"],["Active","1993–2021"],["Members","Thomas Bangalter, Guy-Manuel de Homem-Christo"],["Earlier band","Darlin’"],["Labels","Soma, Virgin, Columbia, Daft Life and more"]],
genres:{n:"Electronic",c:[{n:"House",c:[{n:"French house"}]},{n:"Disco"}]},
bio:["Daft Punk were Thomas Bangalter and Guy-Manuel de Homem-Christo, who met at school in Paris in 1987. Their first band, Darlin’, lasted about six months. A Melody Maker review dismissed its music as “a daft, punky thrash”, and the pair took their new name from it.","Their debut, Homework (1997), put them at the front of the French house movement, mixing house, funk, disco, techno and rock. From 1999 they hid behind silver and gold robot helmets, and Discovery (2001), with “One More Time” and “Harder, Better, Faster, Stronger”, became a landmark. Their 2006–2007 tour, played from a giant LED pyramid, helped bring dance music to a much wider audience in North America.","They scored Tron: Legacy in 2010, then swapped samples for live musicians on Random Access Memories (2013), which won the Grammy for Album of the Year while “Get Lucky” won Record of the Year. They split in 2021 after 28 years, announcing it with a video called “Epilogue”."],
trivia:["They claimed their sampler exploded at 9:09 am on 9 September 1999, and that they woke up from surgery as robots.","Bangalter’s helmet was silver; Homem-Christo’s was gold.","Their only US number one came in 2016, on “Starboy” by the Weeknd.","Kanye West’s “Stronger” is built on “Harder, Better, Faster, Stronger”.","A flatworm, Baicalellia daftpunka, was named after them in 2018 because it partly resembles one of their helmets.","Japanese artist Leiji Matsumoto made Interstella 5555, an animated film set to Discovery, with them.","Bangalter said the 1974 film Phantom of the Paradise was the foundation for much of what they did artistically."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Daft_Punk">Wikipedia: Daft Punk</a>, available under CC BY-SA 4.0. Photo: Sony Music Entertainment, edited by W.carter, <a href="https://commons.wikimedia.org/wiki/File:Daft_Punk_in_2013_2-_centered.jpg">Wikimedia Commons</a>, CC BY 4.0.'
},

"black-sabbath":{
name:"Black Sabbath",real:"Tony Iommi, Geezer Butler, Bill Ward and Ozzy Osbourne",pic:"assets/artists-or-bands/black-sabbath-band-image.jpg",
facts:[["Formed","1968, Birmingham, England"],["Active","1968–2006, 2011–2017, 2025"],["Original line-up","Ozzy Osbourne, Tony Iommi, Geezer Butler, Bill Ward"],["Later singers","Ronnie James Dio, Ian Gillan, Glenn Hughes, Tony Martin"],["Labels","Vertigo, Warner Bros., I.R.S., Sanctuary and more"]],
genres:{n:"Metal",c:[{n:"Heavy metal"}]},
bio:["Black Sabbath grew out of the Birmingham blues scene. Guitarist Tony Iommi, bassist Geezer Butler, drummer Bill Ward and singer Ozzy Osbourne started out as the Polka Tulk Blues Band, became Earth, and took the name Black Sabbath in August 1969.","Their self-titled debut came out in February 1970 and reached number 8 in the UK; Paranoid followed the same year and went to number one. Albums such as Master of Reality, Vol. 4 and Sabbath Bloody Sabbath set the template for heavy metal: down-tuned riffs, slow menace and dark lyrics.","Osbourne was fired in 1979. Ronnie James Dio sang on Heaven and Hell and Mob Rules, and many line-up changes followed. The original four reunited in 1997 and again in 2011, released 13 in 2013, and played a farewell show in Birmingham in 2017. Their last concert, Back to the Beginning at Villa Park, took place on 5 July 2025; Osbourne died seventeen days later. They joined the Rock and Roll Hall of Fame in 2006."],
trivia:["They changed their name from Earth because they kept being mistaken for another English band called Earth.","The debut album was released on Friday the 13th, February 1970.","Paranoid was meant to be called War Pigs; the record company changed the title.","A stage set ordered in metres instead of feet produced a Stonehenge replica too big to fit on any stage.","The 1974 California Jam, where they played, drew more than 200,000 fans.","They won two Grammys for Best Metal Performance and a Grammy Lifetime Achievement Award."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Black_Sabbath">Wikipedia: Black Sabbath</a>, available under CC BY-SA 4.0.'
},
"judas-priest":{
name:"Judas Priest",real:"Rob Halford, Glenn Tipton, K. K. Downing and Ian Hill",pic:"assets/artists-or-bands/judas-priest-band-image.jpg",
facts:[["Formed","1969, Birmingham, England"],["Active","1969–1992, 1996–present"],["Core line-up","Rob Halford, K. K. Downing, Glenn Tipton, Ian Hill"],["Named after","Bob Dylan’s “The Ballad of Frankie Lee and Judas Priest”"],["Labels","Gull, Columbia/CBS, Epic, Sony, SPV and more"]],
genres:{n:"Metal",c:[{n:"Heavy metal"}]},
bio:["Judas Priest formed in Birmingham in 1969. Singer Rob Halford joined in 1973 and guitarist Glenn Tipton in 1974, and with K. K. Downing and Ian Hill they became the band’s core. After a weak debut, Rocka Rolla, the albums Sad Wings of Destiny and Sin After Sin pared the blues out of their sound.","British Steel (1980) brought them to a mainstream audience, and Screaming for Vengeance (1982) gave them their most popular song, “You’ve Got Another Thing Comin’”. With drummer Scott Travis, Painkiller (1990) returned them to a faster, heavier sound.","Halford left in 1992 and Tim “Ripper” Owens sang with the band from 1996 to 2003, when Halford returned. Richie Faulkner replaced Downing in 2011. Later albums include Firepower (2018) and Invincible Shield (2024). The band won a Grammy in 2010 and entered the Rock and Roll Hall of Fame in 2022."],
trivia:["Sin After Sin was the first of eleven albums in a row certified Gold or Platinum in the US.","Halford was badly hurt in Toronto in 1991 when his motorbike hit a drum riser on stage.","In 1990 a US court case claiming hidden messages in their music was dismissed; the judge called the supposed message a coincidence of a guitar chord and a breath.","Their first international tour, in 1974, included a hotel gig in Tønsberg, Norway.","They were among the first inductees of the VH1 Rock Honors in 2006."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Judas_Priest">Wikipedia: Judas Priest</a>, available under CC BY-SA 4.0.'
},
"iron-maiden":{
name:"Iron Maiden",real:"Founded by Steve Harris",pic:"assets/artists-or-bands/iron-maiden-band-image.jpg",
facts:[["Formed","1975, Leyton, East London, England"],["Active","1975–present"],["Line-up","Steve Harris, Bruce Dickinson, Dave Murray, Adrian Smith, Janick Gers, Nicko McBrain"],["Earlier singers","Paul Di’Anno, Blaze Bayley"],["Labels","EMI, Parlophone, Capitol, Columbia, BMG and more"]],
genres:{n:"Metal",c:[{n:"Heavy metal",c:[{n:"New wave of British heavy metal"}]}]},
bio:["Iron Maiden was formed in East London in 1975 by bassist and main songwriter Steve Harris. They played their first show in May 1976 and became leaders of the new wave of British heavy metal; their self-titled debut reached number 4 in the UK in 1980.","Bruce Dickinson replaced Paul Di’Anno in 1981, and The Number of the Beast (1982), his first album with the band, has sold almost 20 million copies. Blaze Bayley sang from 1994 to 1999, when Dickinson and guitarist Adrian Smith returned and the band’s popularity rose again.","Iron Maiden have sold more than 130 million albums. The Final Frontier, The Book of Souls and Senjutsu each went to number one in more than 25 countries."],
trivia:["Harris named the band after the iron maiden torture device, which a film version of The Man in the Iron Mask brought to mind.","Their mascot, Eddie, has appeared on almost every cover for more than 40 years.","Their demo The Soundhouse Tapes sold all 5,000 copies within weeks.","Harris and guitarist Dave Murray are the only members to play on every album.","In 1984 they were the first Western act to bring a full-scale production behind the Iron Curtain, starting with five shows in Poland.","Their 1988 headline set at Donington drew 107,000 people, the festival’s largest crowd."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Iron_Maiden">Wikipedia: Iron Maiden</a>, available under CC BY-SA 4.0.'
},
"metallica":{
name:"Metallica",real:"Founded by James Hetfield and Lars Ulrich",pic:"assets/artists-or-bands/metallica-band-image.jpg",
facts:[["Formed","1981, Los Angeles, California"],["Active","1981–present"],["Line-up","James Hetfield, Lars Ulrich, Kirk Hammett, Robert Trujillo"],["Former members","Cliff Burton, Jason Newsted, Dave Mustaine, Ron McGovney"],["Labels","Megaforce, Elektra, Vertigo, Warner Bros., Blackened"]],
genres:{n:"Metal",c:[{n:"Heavy metal"},{n:"Thrash metal"},{n:"Speed metal"}]},
bio:["Metallica was formed in Los Angeles in 1981 by singer and guitarist James Hetfield and drummer Lars Ulrich. Their early albums made them leaders of thrash metal, and Master of Puppets (1986) was their first commercial success.","Bassist Cliff Burton was killed in a tour bus crash in Sweden in 1986. …And Justice for All (1988) earned the band’s first Grammy nomination, and the self-titled 1991 album, known as the Black Album, carried them to a mainstream audience and became the best-selling album of the SoundScan era.","Death Magnetic (2008) returned to a thrash sound, and 72 Seasons followed in 2023. Metallica have sold more than 163 million albums, won ten Grammys and joined the Rock and Roll Hall of Fame in 2009."],
trivia:["Ulrich’s 1981 newspaper ad looked for musicians who liked Tygers of Pan Tang, Diamond Head and Iron Maiden.","Early pressings of the 1982 compilation Metal Massacre misspelled their name as “Mettallica”.","Kirk Hammett replaced Dave Mustaine on 11 April 1983, the same day Mustaine was dismissed.","The Black Album was remixed three times, cost US$1 million, and debuted at number one in 10 countries.","In December 2013 they played in Antarctica, becoming the first band to perform on all seven continents.","At the 1989 Grammys they lost Best Hard Rock/Metal Performance to Jethro Tull."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Metallica">Wikipedia: Metallica</a>, available under CC BY-SA 4.0.'
},

"bob-marley":{
name:"Bob Marley",real:"Robert Nesta Marley",pic:"assets/artists-or-bands/bob-marley-artist-image.jpg",alias:["The Wailers","Bob Marley and the Wailers"],
facts:[["Born","6 February 1945, Nine Mile, Saint Ann, Jamaica"],["Died","11 May 1981, Miami, Florida, aged 36"],["Active","1962–1980"],["Band","The Wailers, with Peter Tosh and Bunny Wailer"],["Labels","Studio One, Upsetter, Island, Tuff Gong and more"]],
genres:{n:"Reggae",c:[{n:"Ska"},{n:"Rocksteady"}]},
bio:["Bob Marley was born in Nine Mile, Jamaica, in 1945 and moved to Trenchtown in Kingston at 12. There he formed a vocal group with Peter Tosh and Bunny Wailer that became the Wailers; their 1964 single “Simmer Down” went to number one in Jamaica.","The Wailers moved from ska and rocksteady to reggae in the late 1960s, and Marley became a Rastafarian. Signed to Island Records, they released Catch a Fire in 1973, and Eric Clapton’s cover of “I Shot the Sheriff” spread Marley’s name further. Exodus (1977) was recorded in England after he survived an attempt on his life in Kingston in December 1976.","At the One Love Peace Concert in 1978 he brought rival political leaders Michael Manley and Edward Seaga together on stage. Marley died of cancer in 1981, aged 36. He has sold more than 75 million records, his compilation Legend is the best-selling reggae album ever, and he joined the Rock and Roll Hall of Fame in 1994."],
trivia:["“Simmer Down” sold an estimated 70,000 copies.","The first sleeve of Catch a Fire was shaped like a Zippo lighter with a lid that lifted up.","While living in Delaware he worked at a DuPont lab and a Chrysler plant under the name “Donald Marley”.","He said he drove a BMW because the letters stood for “Bob Marley and the Wailers”.","He was buried with his red Gibson Les Paul guitar and a Bible.","Jamaica awarded him its Order of Merit in 1981."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Bob_Marley">Wikipedia: Bob Marley</a>, available under CC BY-SA 4.0.'
},
"toots-and-the-maytals":{
name:"Toots and the Maytals",real:"Toots Hibbert, Raleigh Gordon and Jerry Mathias",pic:"assets/artists-or-bands/toots-&-the-maytals-artist-image.jpg",
facts:[["Formed","1962, Kingston, Jamaica"],["Leader","Frederick “Toots” Hibbert (died 11 September 2020)"],["Original trio","Toots Hibbert, Raleigh Gordon, Jerry Mathias"],["Gave reggae its name","“Do the Reggay”, 1968"],["Labels","Beverley’s, Trojan, Island, Mango, V2"]],
genres:{n:"Reggae",c:[{n:"Ska"},{n:"Rocksteady"}]},
bio:["Toots Hibbert met Raleigh Gordon and Jerry Mathias in Kingston in 1962, and the three formed a vocal trio known for close, gospel-style harmonies. They first charted with Coxsone Dodd at Studio One, then worked with Prince Buster and Byron Lee, and won Jamaica’s Independence Festival song contest in 1966 with “Bam Bam”.","Late in 1966 Hibbert was jailed for 18 months for marijuana possession. Back with producer Leslie Kong, the group released “Do the Reggay” in 1968, the song that gave reggae its name.","Two of their songs on the soundtrack of The Harder They Come (1972), and a deal with Island Records, took them to audiences abroad. They won the Grammy for Best Reggae Album in 2004 and again in 2021, after Hibbert’s death in 2020 at 77."],
trivia:["They hold the record for the most Jamaican number-one hits: 31.","They won Jamaica’s Independence Festival song contest three times, including 1966 with “Bam Bam” and 1972 with “Pomp and Pride”.","In 1980 they recorded, pressed and released the album Toots Live within 24 hours, but Guinness never logged the record because nobody told them.","“Beautiful Woman” went to number one in New Zealand in 1982.","In 2017 they became only the second reggae act to play Coachella."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Toots_and_the_Maytals">Wikipedia: Toots and the Maytals</a>, available under CC BY-SA 4.0.'
},
"jimmy-cliff":{
name:"Jimmy Cliff",real:"James Ezekiel Chambers",pic:"assets/artists-or-bands/jimmy-cliff-artist-image.jpg",
facts:[["Born","30 July 1944, Saint James, Jamaica"],["Died","24 November 2025, Kingston, Jamaica, aged 81"],["Active","1962–2025"],["Film","Starred in The Harder They Come (1972)"],["Labels","Island, Trojan, CBS, Columbia, EMI and more"]],
genres:{n:"Reggae",c:[{n:"Ska"},{n:"Rocksteady"}]},
bio:["Jimmy Cliff was born James Chambers in Saint James, Jamaica, one of nine children, and was writing songs by primary school. At 14 his father took him to Kingston, where he took the stage name Cliff. Producer Leslie Kong recorded him, and “Hurricane Hattie” was a hit when he was 17.","He signed with Island Records and moved to the UK, releasing Hard Road to Travel in 1967. “Wonderful World, Beautiful People” and “Many Rivers to Cross” followed in 1969.","In 1972 he starred as Ivanhoe Martin in The Harder They Come, the first major commercial film from Jamaica, and its soundtrack carried reggae around the world. He won two Grammys for Best Reggae Album, received Jamaica’s Order of Merit in 2003 and joined the Rock and Roll Hall of Fame in 2010."],
trivia:["He chose the name Cliff for the heights he hoped his career would reach.","His cover of Cat Stevens’s “Wild World” reached number 8 in the UK in 1970.","Paul Simon recorded “Mother and Child Reunion” with Cliff’s backing band.","Bob Dylan called Cliff’s “Vietnam” the best protest song he had ever heard.","Bruce Springsteen added Cliff’s song “Trapped” to his live shows.","His cover of “I Can See Clearly Now” featured in the film Cool Runnings."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Jimmy_Cliff">Wikipedia: Jimmy Cliff</a>, available under CC BY-SA 4.0.'
},
"lee-scratch-perry":{
name:"Lee “Scratch” Perry",real:"Rainford Hugh Perry",pic:"assets/artists-or-bands/lee-scrartch-perry-artist-image.jpg",
facts:[["Born","20 March 1936, Kendal, Hanover, Jamaica"],["Died","29 August 2021, Lucea, Hanover, Jamaica, aged 85"],["Active","1958–2021"],["Studio","The Black Ark, built in his back yard in 1973"],["Labels","Upsetter, Trojan, Island, Pama, Black Art and more"]],
genres:{n:"Reggae",c:[{n:"Dub"},{n:"Ska"},{n:"Rocksteady"}]},
bio:["Lee Perry began in the late 1950s selling records for Coxsone Dodd’s sound system, then worked at Dodd’s Studio One, where he recorded nearly thirty songs. After falling out with Dodd he joined Joe Gibbs, and in 1968 he left Gibbs and set up his own label, Upsetter Records.","Around 1970 he worked with Bob Marley and the Wailers. In 1973 he built the Black Ark studio in his back yard, where he produced Marley, Junior Byles, the Heptones, the Congos and others. His remixes and studio effects there made him one of the pioneers of dub.","By 1978 the Black Ark had fallen apart, and it later burned down. Perry’s career revived from the late 1980s through work with Adrian Sherwood and Mad Professor. He won a Grammy in 2003 for Jamaican E.T., and Jamaica made him a Commander of the Order of Distinction in 2012."],
trivia:["“People Funny Boy”, a jab at Joe Gibbs, used a crying baby as a sample and sold 60,000 copies in Jamaica.","His instrumental “The Return of Django” was a top-five hit in the UK in 1969.","After leaving school at 15 he worked as a labourer building the first road into Negril.","He said he blew smoke into the microphone so the weed would get into the song.","He insisted he set the Black Ark on fire himself.","Rolling Stone ranked him 100th among the greatest artists of all time in 2004."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Lee_%22Scratch%22_Perry">Wikipedia: Lee “Scratch” Perry</a>, available under CC BY-SA 4.0.'
},

"the-beatles":{
name:"The Beatles",real:"John Lennon, Paul McCartney, George Harrison and Ringo Starr",pic:"assets/artists-or-bands/the-beatles-band-image.jpg",
facts:[["Formed","1960, Liverpool, England"],["Active","1960–1970"],["Members","John Lennon, Paul McCartney, George Harrison, Ringo Starr"],["Early members","Stuart Sutcliffe, Pete Best"],["Labels","Parlophone, Capitol, Vee-Jay, Apple and more"]],
genres:{n:"Rock",c:[{n:"Pop"},{n:"Beat"},{n:"Psychedelia"}]},
bio:["The Beatles grew out of the Quarrymen, a group John Lennon started in 1956. As the Beatles, from 1960, they built their name in Liverpool clubs and in Hamburg. Brian Epstein became their manager in January 1962; Decca turned them down, but producer George Martin signed them to EMI’s Parlophone label, and Ringo Starr replaced drummer Pete Best that year.","“Love Me Do” reached number 17 in late 1962, and Beatlemania followed. In February 1964 they played The Ed Sullivan Show and their first US concert, and that April they held the top five places on the Billboard Hot 100.","They stopped touring in 1966 to work in the studio, releasing Sgt. Pepper’s Lonely Hearts Club Band in 1967, and broke up in 1970. With estimated sales of more than 600 million units, they won nine Grammys and an Academy Award and joined the Rock and Roll Hall of Fame in 1988."],
trivia:["“She Loves You” sold three-quarters of a million copies in under four weeks and stayed the UK’s best-selling record until 1978.","About 73 million Americans watched their first Ed Sullivan appearance.","In the week of 4 April 1964 they held twelve places on the Billboard Hot 100.","Paul McCartney recorded “Yesterday” without the other three Beatles.","Their 1965 show at Shea Stadium drew a world-record crowd of 55,600."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/The_Beatles">Wikipedia: The Beatles</a>, available under CC BY-SA 4.0.'
},
"michael-jackson":{
name:"Michael Jackson",real:"Michael Joseph Jackson",pic:"assets/artists-or-bands/Michael-Jackson-artist-image.jpg",
facts:[["Born","29 August 1958, Gary, Indiana"],["Died","25 June 2009, Los Angeles, California"],["Active","1964–2009"],["Group","The Jackson 5"],["Labels","Steeltown, Motown, Epic, Sony"]],
genres:{n:"Pop",c:[{n:"R&B"},{n:"Soul"},{n:"Funk"},{n:"Disco"}]},
bio:["Michael Jackson began as a singer in the Jackson 5, who signed to Motown and topped the US chart with “I Want You Back” in January 1970. His first adult solo album, Off the Wall (1979), produced four US top-10 hits.","Thriller (1982) became the best-selling album in the world, with an estimated 70 million copies. It spent 37 weeks at number one in the US and was the first album with seven top-10 singles. Its videos for “Billie Jean”, “Beat It” and “Thriller” changed what a music video could be, and in 1983 he first performed the moonwalk on the TV special Motown 25.","Bad (1987) was the first album with five US number-one singles, and Dangerous and HIStory followed. Jackson died in 2009 while preparing for his This Is It concerts. He sold more than 500 million records, won 13 Grammys and was inducted into the Rock and Roll Hall of Fame twice."],
trivia:["At the 1984 Grammys he won eight awards in one night, a record at the time.","His performance of “Dancing Machine” on Soul Train helped popularise the robot dance.","In 1980 he won a royalty rate of 37 percent of wholesale album profit, the highest in the industry.","“We Are the World”, which he wrote with Lionel Richie, sold 20 million copies.","His seven sold-out Wembley Stadium shows on the Bad tour drew 504,000 people, a Guinness world record.","He is the only artist with a US top-10 single in six different decades."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Michael_Jackson">Wikipedia: Michael Jackson</a>, available under CC BY-SA 4.0.'
},
"madonna":{
name:"Madonna",real:"Madonna Louise Ciccone",pic:"assets/artists-or-bands/madonna-artist-image.jpg",
facts:[["Born","16 August 1958, Bay City, Michigan"],["Active","1979–present"],["Early bands","Breakfast Club, Emmy"],["Own company","Maverick (1992–2009)"],["Labels","Sire, Warner, Maverick, Interscope"]],
genres:{n:"Pop",c:[{n:"Dance"},{n:"Electronic"}]},
bio:["Madonna moved to New York City in 1978 to dance, and played drums, guitar and sang in the rock bands Breakfast Club and Emmy. Her debut album, Madonna, came out in 1983, and Like a Virgin (1984) became her first number-one album in several countries.","Like a Prayer (1989) sold 15 million copies and made critics treat her as a serious artist. Erotica and her book Sex caused a backlash in 1992, but she won a Golden Globe for the film Evita in 1996, and Ray of Light (1998), often called her best album, won four Grammys.","She is the best-selling female music artist of all time and the first woman to earn US$1 billion from concerts, with twelve US number-one singles. She has won seven Grammys and joined the Rock and Roll Hall of Fame in her first year of eligibility."],
trivia:["As a child her father paid her a quarter for every A on her report card.","Her 1987 concert near Paris drew more than 130,000 people, then a record for a female artist.","Pepsi dropped her sponsorship after religious groups objected to the “Like a Prayer” video.","Her 1991 documentary Truth or Dare was the highest-grossing documentary for eleven years.","Music (2000) sold four million copies in its first ten days."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Madonna">Wikipedia: Madonna</a>, available under CC BY-SA 4.0.'
},
"britney-spears":{
name:"Britney Spears",real:"Britney Jean Spears",pic:"assets/artists-or-bands/britney-spears-artist-image.jpg",
facts:[["Born","2 December 1981, McComb, Mississippi"],["Raised","Kentwood, Louisiana"],["Active","1992–present"],["TV start","The All-New Mickey Mouse Club, 1992"],["Labels","Jive, RCA"]],
genres:{n:"Pop"},
bio:["Britney Spears grew up in Kentwood, Louisiana, competed on Star Search, and joined The All-New Mickey Mouse Club in 1992. Jive Records signed her in 1997 after three other labels had turned her down.","Her debut single “…Baby One More Time” topped the US chart in late 1998, and the album followed in January 1999. Half of it was recorded at Cheiron Studios in Stockholm with producers including Max Martin and Denniz Pop. Oops!… I Did It Again (2000) also went straight to number one.","“Toxic”, from In the Zone (2003), won her a Grammy, and Blackout and Circus followed. From 2013 to 2015 she played the Piece of Me residency in Las Vegas. She has sold more than 150 million records."],
trivia:["The record label wanted an animated video for “…Baby One More Time”; the schoolgirl idea was hers.","The debut album sold more than 10 million copies in its first year, the most ever by a teenage artist.","Oops!… I Did It Again sold 1.3 million copies in its first week, a record for a solo artist.","She was the first woman of the SoundScan era whose first four albums all debuted at number one in the US.","With Circus she became the youngest woman to have five albums debut at number one in the US."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Britney_Spears">Wikipedia: Britney Spears</a>, available under CC BY-SA 4.0.'
},
"bob-dylan":{
name:"Bob Dylan",real:"Robert Allen Zimmerman",pic:"assets/artists-or-bands/bob-dylan-artist-image.jpg",
facts:[["Born","24 May 1941, Duluth, Minnesota"],["Raised","Hibbing, Minnesota"],["Active","1957–present"],["Nobel Prize","Literature, 2016"],["Labels","Columbia, Asylum"]],
genres:{n:"Rock",c:[{n:"Folk rock"},{n:"Folk"},{n:"Blues"},{n:"Country"},{n:"Gospel"}]},
bio:["Bob Dylan was born Robert Zimmerman in Duluth, Minnesota, and grew up in Hibbing. In 1961 he moved to New York to visit his hero Woody Guthrie. The Freewheelin’ Bob Dylan (1963) included “Blowin’ in the Wind”, which became an anthem of the civil rights and anti-war movements.","At the 1965 Newport Folk Festival he played with an electric band, to cheers and boos. “Like a Rolling Stone”, a six-minute single, reached number 2 in the US, and Highway 61 Revisited and Blonde on Blonde followed. After a motorcycle crash in 1966 he did not tour for almost eight years.","Blood on the Tracks (1975) is counted among his masterpieces, and since the late 1980s he has toured almost constantly. He received the 2016 Nobel Prize in Literature “for having created new poetic expressions within the great American song tradition”, along with ten Grammys and an Academy Award."],
trivia:["His debut album sold only 5,000 copies in its first year.","He saw Buddy Holly play in Duluth on 31 January 1959, days before Holly died.","In 1959 he played piano with Bobby Vee under the name Elston Gunnn.","“Hurricane” ran over eight minutes and still reached number 33 in the US.","He met violinist Scarlet Rivera when he saw her walking down the street with her violin case.","The Byrds’ electric version of his “Mr. Tambourine Man” went to number one in the US and UK."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Bob_Dylan">Wikipedia: Bob Dylan</a>, available under CC BY-SA 4.0.'
},
"led-zeppelin":{
name:"Led Zeppelin",real:"Robert Plant, Jimmy Page, John Paul Jones and John Bonham",pic:"assets/artists-or-bands/led-zeppelin-band-image.jpg",
facts:[["Formed","1968, London, England"],["Active","1968–1980"],["Members","Robert Plant, Jimmy Page, John Paul Jones, John Bonham"],["Own label","Swan Song (from 1974)"],["Labels","Atlantic, Swan Song"]],
genres:{n:"Rock",c:[{n:"Hard rock"},{n:"Blues rock"},{n:"Folk rock"}]},
bio:["After the Yardbirds played their last show in July 1968, guitarist Jimmy Page put together a new band to play the group’s remaining Scandinavian dates as the New Yardbirds. A legal letter forced a new name, and they chose Led Zeppelin, from the idea of a “lead balloon”.","Their 1969 debut reached the top ten in several countries, and Led Zeppelin II became their first number-one album. The untitled fourth album (1971), with “Stairway to Heaven”, has sold 37 million copies. Physical Graffiti (1975) was the first release on their own label, Swan Song.","Drummer John Bonham died on 25 September 1980, and the band announced its break-up that December. The others reunited for Live Aid in 1985 and, with Bonham’s son Jason on drums, at London’s O2 Arena in 2007. They have sold an estimated 200 to 300 million records and joined the Rock and Roll Hall of Fame in 1995."],
trivia:["Atlantic signed them without seeing them play, for an advance of $143,000.","The debut album’s cover is a 1937 photo of the burning Hindenburg airship.","“Stairway to Heaven” was never released as a single, yet it was the most requested song on US rock radio in the 1970s.","Their 1973 show at Tampa Stadium drew 56,800 fans, beating the Beatles’ Shea Stadium record.","About 20 million people asked for tickets to the 2007 reunion, a Guinness record."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Led_Zeppelin">Wikipedia: Led Zeppelin</a>, available under CC BY-SA 4.0.'
},
"nirvana":{
name:"Nirvana",real:"Kurt Cobain, Krist Novoselic and Dave Grohl",pic:"assets/artists-or-bands/nirvana-band-image.jpg",
facts:[["Formed","1987, Aberdeen, Washington"],["Active","1987–1994"],["Members","Kurt Cobain, Krist Novoselic, Dave Grohl (from 1990)"],["Earlier drummers","Aaron Burckhard, Dale Crover, Dave Foster, Chad Channing, Dan Peters"],["Labels","Sub Pop, DGC"]],
genres:{n:"Rock",c:[{n:"Grunge"},{n:"Alternative rock"},{n:"Punk rock"}]},
bio:["Nirvana was formed in Aberdeen, Washington, in 1987 by singer and guitarist Kurt Cobain and bassist Krist Novoselic, and became part of the Seattle grunge scene. Their debut album, Bleach, came out on Sub Pop in 1989, and drummer Dave Grohl joined in September 1990.","After signing with DGC they released Nevermind (1991). Its first single, “Smells Like Teen Spirit”, was a breakthrough, and in January 1992 the album knocked Michael Jackson’s Dangerous off number one in the US. In Utero (1993) topped the charts in the US and UK.","The band ended in April 1994 after Cobain’s death. MTV Unplugged in New York was released later that year and won a Grammy. Nirvana have sold more than 75 million records and joined the Rock and Roll Hall of Fame in 2014, their first year of eligibility."],
trivia:["Before settling on Nirvana they played as Skid Row, Pen Cap Chew, Bliss and Ted Ed Fred.","Bleach cost $606.17 to record.","The label hoped Nevermind would sell 250,000 copies; by Christmas 1991 it was selling 400,000 a week in the US.","In Utero was recorded in two weeks in Cannon Falls, Minnesota, for $25,000.","A British band also called Nirvana sued over the name; it was settled out of court."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Nirvana_(band)">Wikipedia: Nirvana (band)</a>, available under CC BY-SA 4.0.'

"mamie-smith":{
name:"Mamie Smith",real:"Born Mamie Robinson",pic:"assets/artists-or-bands/mamie-smith-artist-image.png",
facts:[["Born","26 May 1891, Cincinnati, Ohio (older sources say 1883)"],["Died","23 October 1946, New York City"],["Band","Mamie Smith & Her Jazz Hounds"],["Breakthrough","“Crazy Blues”, recorded 10 August 1920"],["Labels","Okeh, Ajax, Victor"]],
genres:{n:"Blues",c:[{n:"Vaudeville"}]},
bio:["Mamie Smith was touring as a dancer by about the age of ten, and as a teenager danced in Salem Tutt Whitney’s Smart Set. In 1913 she left to sing in Harlem clubs.","Songwriter Perry Bradford persuaded Fred Hager of Okeh Records to record a Black singer, and on 14 February 1920 she made her first record. On 10 August 1920 she recorded Bradford’s “Crazy Blues”, which reached number 3 and sold a million copies in less than a year.","She toured the US and Europe with her band, the Jazz Hounds, whose players over the years included Coleman Hawkins and Bubber Miley. She retired in 1931, came back in 1939 to act in films such as Paradise in Harlem, and died in New York in 1946."],
trivia:["Her birth year was given as 1883 for decades, until a birth certificate showing 1891 was found in 2018.","Okeh was threatened with a boycott for recording a Black singer, yet the record sold extremely well.","“Crazy Blues” entered the Grammy Hall of Fame in 1994 and the National Recording Registry in 2005.","She sang on the radio station KGW in Portland, Oregon, in 1923.","Her grave stayed unmarked until fans raised over $8,000 for a granite headstone, put up in 2013."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Mamie_Smith">Wikipedia: Mamie Smith</a>, available under CC BY-SA 4.0.'
},
"robert-johnson":{
name:"Robert Johnson",real:"Robert Leroy Johnson",pic:"assets/artists-or-bands/robert-johnson-artist-image.jpg",
facts:[["Born","Probably 8 May 1911, Hazlehurst, Mississippi"],["Died","16 August 1938, near Greenwood, Mississippi, aged 27"],["Active","1929–1938"],["Recordings","29 songs, in San Antonio (1936) and Dallas (1937)"],["Label","Vocalion"]],
genres:{n:"Blues",c:[{n:"Delta blues"}]},
bio:["Robert Johnson grew up in Memphis and the Mississippi Delta. He learned guitar partly from Ike Zimmerman; Son House remembered him as a weak player who suddenly became brilliant. From 1932 he travelled between Memphis, Helena and Delta towns, playing street corners, juke joints and dances.","Producer Don Law recorded him in San Antonio in November 1936 and in Dallas in June 1937. Those sessions produced 29 songs, among them “Cross Road Blues”, which became a blues standard.","He died in 1938 at 27; the cause is still uncertain. Columbia’s 1961 reissue King of the Delta Blues Singers brought his music to a new audience and fed the British blues boom. He was among the first inductees of the Rock and Roll Hall of Fame in 1986."],
trivia:["The story of selling his soul at the crossroads was first told about another bluesman, Tommy Johnson, who was no relation.","Nobody knows where he is buried; three different markers stand at possible graves near Greenwood.","For decades no photos of him were thought to exist; three were found in 1972 and 1973.","He used at least eight different surnames in different places.","In 1938 John Hammond wanted him for a Carnegie Hall concert, learned he had died, and played two of his records from the stage instead."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Robert_Johnson">Wikipedia: Robert Johnson</a>, available under CC BY-SA 4.0.'
},
"muddy-waters":{
name:"Muddy Waters",real:"McKinley Morganfield",pic:"assets/artists-or-bands/muddy-waters-artist-image.jpg",
facts:[["Born","4 April 1913, Issaquena County, Mississippi"],["Died","30 April 1983, Westmont, Illinois, aged 70"],["Active","1941–1982"],["Band","Little Walter, Jimmy Rogers, Otis Spann, Elga Edmonds"],["Labels","Aristocrat, Chess, Blue Sky"]],
genres:{n:"Blues",c:[{n:"Chicago blues"},{n:"Delta blues"}]},
bio:["Muddy Waters grew up on Stovall Plantation near Clarksdale, Mississippi, where Alan Lomax recorded him for the Library of Congress in 1941 and 1942. In 1943 he moved to Chicago to play music full-time, and in 1944 he bought his first electric guitar, because acoustic instruments couldn’t be heard in noisy clubs.","He recorded for Aristocrat, soon renamed Chess Records, and “I Can’t Be Satisfied” was a hit in 1948. With a band that included Little Walter on harmonica and Otis Spann on piano he cut classics such as “Hoochie Coochie Man” and “I Just Want to Make Love to You”.","His 1958 tour of England startled audiences with its electric sound and inspired a generation of British players. Hard Again (1977), produced by Johnny Winter, was a late comeback. He won six Grammys and joined the Rock and Roll Hall of Fame in 1987."],
trivia:["His grandmother called him “Muddy” because he loved playing in the muddy water of Deer Creek.","At 17 he sold his last horse and put part of the money toward a guitar.","The Rolling Stones named themselves after his song “Rollin’ Stone”.","British papers in 1958 headlined his shows “Screaming Guitar and Howling Piano”.","He later disowned his own album Electric Mud (1968).","ZZ Top’s Billy Gibbons made a guitar, Muddywood, from a plank of his childhood home; a crater on Mercury is also named after him."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Muddy_Waters">Wikipedia: Muddy Waters</a>, available under CC BY-SA 4.0.'
},
"b-b-king":{
name:"B.B. King",real:"Riley B. King",pic:"assets/artists-or-bands/b.b.-king-artist-image.jpg",
facts:[["Born","16 September 1925, near Itta Bena, Mississippi"],["Died","14 May 2015, Las Vegas, Nevada, aged 89"],["Active","1942–2014"],["Guitar","Lucille"],["Labels","RPM, Kent, ABC, BluesWay, MCA, Geffen and more"]],
genres:{n:"Blues",c:[{n:"Electric blues"},{n:"Memphis blues"},{n:"Rhythm and blues"},{n:"Soul"}]},
bio:["B.B. King grew up in the Mississippi Delta and taught himself guitar. In Memphis he worked as a singer and disc jockey at the radio station WDIA, where he was called the “Beale Street Blues Boy”, later shortened to B. B.","“3 O’Clock Blues” became his first R&B number one in 1952, and he became one of the biggest R&B names of the 1950s, touring almost without a break. Live at the Regal, recorded in November 1964, is hailed as one of the greatest blues albums.","In the late 1960s he reached rock audiences, opening for the Rolling Stones in 1969, and “The Thrill Is Gone” won a Grammy in 1970. He joined the Rock and Roll Hall of Fame in 1987, received the Presidential Medal of Freedom in 2006, and died in Las Vegas in 2015."],
trivia:["In 1956 he played 342 shows.","His guitar Lucille is named after the woman at the centre of a fight that started a fire in Twist, Arkansas.","His first guitar cost $15, taken out of his wages over two months.","Gibson launched a B.B. King Lucille model guitar in 1980.","In 1997 he gave a Lucille guitar to Pope John Paul II after a concert at the Vatican."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/B.B._King">Wikipedia: B.B. King</a>, available under CC BY-SA 4.0.'
}
