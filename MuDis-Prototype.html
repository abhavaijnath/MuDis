/* Layout: one shell (search, MuDis, Path Map, Note it) that swaps between the genre-column home (L00) and a genre page (L01). Colour darkens with trail depth, as in the original two files. Single look by choice: greys only. */
:root{--bg:#fff;--fg:#111;--gut:36px;--line:rgba(17,17,17,.3);color-scheme:light}

:root[data-level="3"]{--bg:#6a6a69;--fg:#f3f3f1;--line:rgba(243,243,241,.3)}
:root[data-level="4"]{--bg:#2c2c2b;--fg:#f3f3f1;--line:rgba(243,243,241,.3)}
:root[data-level="5"]{--bg:#0b0b0b;--fg:#f3f3f1;--line:rgba(243,243,241,.3)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:"Nimbus Sans","Nimbus Sans L",Helvetica,"Helvetica Neue",Arial,sans-serif;line-height:1.5;transition:background .9s ease,color .9s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding:22px max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));position:relative;width:100%}
html:not([data-view="home"]) .top{max-width:1180px;margin:0 auto}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 16px;border:1px solid var(--fg);border-radius:99px;background:transparent;font-size:13px}
.search{width:min(260px,100%);justify-content:flex-start;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:13px}
.search input::placeholder{color:var(--fg);opacity:.6}
.search:focus-within{outline:2px solid var(--fg);outline-offset:3px}
.right{justify-self:end;display:grid;gap:8px;width:136px}
/* Top-left: search on the landing page only; everywhere else a back arrow and a home button take its place */
.left{min-width:0}
.navb{display:flex;gap:8px}
.ib{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--fg);border-radius:50%;background:none;transition:background .2s,color .2s}
.ib:hover{background:var(--fg);color:var(--bg)}
html[data-view="home"] .navb,html:not([data-view="home"]) .search{display:none}
.brand{text-align:center;min-width:0}
.brand a{display:block;text-decoration:none;font-weight:500;line-height:.9}
html[data-view="home"] .brand a{font-size:clamp(56px,8.5vw,124px);letter-spacing:-.05em}
html:not([data-view="home"]) .brand a{font-size:20px;letter-spacing:-.04em;padding-top:2px}
.brand p{margin:10px 0 0;font-size:13px;opacity:.7}
html:not([data-view="home"]) .brand p{display:none}
.ptype{display:none;margin-top:3px;font-size:14px;font-weight:600;line-height:1.2}
html:not([data-view="home"]) .ptype{display:block}
.panel{position:absolute;right:max(var(--gut),env(safe-area-inset-right,0px));top:104px;width:min(310px,calc(100% - 2 * var(--gut)));padding:16px;background:var(--bg);border:1px solid var(--fg);z-index:80;display:none;font-size:13.5px;line-height:1.4}
.panel.open{display:block}
.panel h2{margin:0 0 6px;font-size:15px;font-weight:600}
.panel p{margin:0 0 12px}
/* Path Map page: headline, stats, pannable/zoomable trail tree, actions. Background stays the colour of the level you opened it from. */
.mkick{margin:34px 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mhead{margin:0 0 0 -3px;max-width:15em;font-weight:500;font-size:clamp(36px,6vw,84px);letter-spacing:-.045em;line-height:1}

.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:40px 0 34px;padding-top:28px;border-top:1px solid var(--line)}

.mstats span{display:block;margin-top:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mview{position:relative;height:min(62vh,560px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:14px;cursor:grab;touch-action:none;user-select:none}

.mworld{position:absolute;left:0;top:0;transform-origin:0 0}

.mhint{position:absolute;left:18px;bottom:16px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;pointer-events:none;max-width:calc(100% - 300px)}
.mzoom{position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--fg);border-radius:99px;background:var(--bg)}

.mzoom button:hover{background:color-mix(in srgb,var(--fg) 14%,transparent)}

.mzoom hr{width:1px;height:20px;margin:0 4px;border:0;background:var(--fg);opacity:.4}
.mfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.mfoot span:first-child{opacity:.75}
.macts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:44px 0 70px}
.macts button{height:46px;padding:0 26px;border:1px solid var(--fg);border-radius:99px;background:none;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.macts button:hover{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.macts button.main{background:var(--fg);color:var(--bg)}
@media (max-width:700px){.mstats{gap:12px}.mhint{display:none}}
textarea{width:100%;height:130px;resize:vertical;padding:8px;border:1px solid var(--fg);background:transparent;font-size:14px}
.rail{flex:1;display:flex;gap:22px;align-items:flex-start;padding:30px max(var(--gut),env(safe-area-inset-right,0px)) 24px max(var(--gut),env(safe-area-inset-left,0px));overflow:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.col{--w:clamp(190px,17vw,250px);flex:none;width:var(--w)}
.col:last-child{margin-right:12vw}
.gname{margin:0 0 10px;padding:0;border:0;background:none;font-size:15px}
.gname:hover{text-decoration:underline;text-underline-offset:4px}
.stack{--strip:38px;position:relative;height:calc(var(--strip)*(var(--n) - 1) + var(--w))}
.card{position:absolute;left:0;top:calc(var(--i)*var(--strip));z-index:calc(var(--i) + 1);width:100%;max-width:100%;aspect-ratio:1;padding:0;border:0;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 -1px 0 rgba(0,0,0,.14);transition:transform .25s ease,box-shadow .25s ease,opacity .3s}
/* Hover: the strip turns black (title and year stay on it) and the full cover (.peek) opens to its right, a little bigger than the column */
.card:hover,.card:focus-visible,.card.pick{background:#111!important;color:#f3f3f1!important}
.peek{position:fixed;left:0;top:0;z-index:70;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;pointer-events:none;opacity:0;box-shadow:0 16px 40px rgba(0,0,0,.35);transition:opacity .18s ease}

.peek .cb{padding:0 14px 14px}

.peek.art{color:#f3f3f1!important}
.peek.art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(0,0,0,.45),transparent 28%,transparent 62%,rgba(0,0,0,.55))}
.card.dim{opacity:.16}
.card{overflow:hidden}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.card .ct,.card .cb{position:relative;z-index:1}
.card.art{color:#f3f3f1!important}
.card.art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.25) 38px,transparent 30%,transparent 62%,rgba(0,0,0,.55));transition:opacity .2s}
.card.art:hover img,.card.art:focus-visible img,.card.art.pick img,.card.art:hover::before,.card.art:focus-visible::before,.card.art.pick::before{opacity:0}
.ct{display:flex;justify-content:space-between;gap:10px;padding:12px 12px 0;font-size:13px;font-weight:500;line-height:1.1}
.ct span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{display:flex;align-items:center;gap:16px;flex:1;min-width:0}

.wrap{max-width:1180px;width:100%;margin:0 auto;padding:0 max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));flex:1}

.lede.muted{opacity:.75}

.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:172px;max-width:100%;height:76px;border:1px solid var(--fg);border-radius:40px;background:rgba(255,255,255,.35);transition:background .2s,color .2s}
.chip.side{border-style:dashed}

.chip b{font-weight:500;font-size:16px}
.chip i{font-size:11.5px;text-decoration:underline;text-underline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cover{display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1;max-width:100%;min-width:0;padding:12px;border:0;text-align:left;transition:transform .25s ease,box-shadow .25s ease}
.cover:hover,.cover:focus-visible{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.3)}
.cover span{font-size:12.5px;opacity:.85}
.cover strong{display:block;font-size:19px;font-weight:500;letter-spacing:-.02em;line-height:1.1}

.cover{position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover>span,.cover>div{position:relative;z-index:1}

.acover{position:relative;overflow:hidden}

.av{width:130px;height:156px;fill:#c3c3c1;stroke:var(--fg);stroke-width:1}

.artist .aph .av{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80%;height:auto}
.artist .aph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.histbox{overflow-x:auto}
.hist{width:100%;height:auto;display:block;overflow:visible}
.hist path{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.hist line{stroke:var(--fg);stroke-width:3}

.foot{margin-top:80px;padding:20px 0 40px;border-top:1px solid var(--line);font-size:13px;opacity:.8}

/* Landing intro (first visit only): sleeve with "Welcome to MuDis" shrinks left, the record slides out and rolls right
   while the view follows it, bounces off the right wall, then the albums fly in and the header fades in.
   Afterwards the record stays behind the Home columns and turns as you scroll. */
.disc{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.disc.front{z-index:100}
.dworld{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.sleeve{position:absolute;left:0;top:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#111;border:1px solid rgba(0,0,0,.07);box-shadow:0 34px 60px -14px rgba(0,0,0,.5),0 10px 22px -6px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.1);line-height:1;text-align:center;white-space:nowrap}
html.intro .sleeve{display:flex}
.sleeve span{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
.sleeve.on span{opacity:1;transform:none}
.sleeve .sw{font-weight:400;letter-spacing:-.03em}
.sleeve .sm{font-weight:500;letter-spacing:-.05em}
.dwrap{position:absolute;left:0;top:0;border-radius:50%;box-shadow:0 30px 52px -16px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.16)}

.rec span{color:#111;font-weight:500;letter-spacing:-.04em;line-height:1;text-align:center}

}

}

release:"March 1977",label:"Kling Klang",
genres:{n:"Electronic",c:[{n:"Synth-pop",c:[{n:"Electropop"}]}]},cover:"assets/covers/trans-europe-express.jpg",
rec:"Recorded in mid-1976 at Kling Klang Studio in Düsseldorf, with parts mixed at Record Plant Studio in Los Angeles.",
tracks:[["Europe Endless","9:40"],["The Hall of Mirrors","7:56"],["Showroom Dummies","6:15"],["Trans-Europe Express","6:52"],["Metal on Metal","2:11"],["Abzug","4:53"],["Franz Schubert","4:26"],["Endless Endless","0:55"]],
trackNote:"On some later releases, “Abzug” is merged into “Metal on Metal”.",
making:["The album began under the title Europe Endless. The idea of writing about the Trans-Europ Express came from Paul Alessandrini.","Kraftwerk recorded train sounds at railway bridges, then adjusted them so they were less danceable. A customised 32-step analog sequencer, the Synthanorma, let them write more elaborate sequenced lines. The album came out in separate English and German versions."],
reception:"Early reviews were positive. Robert Christgau gave it an A−, and it placed 30th in the 1977 Village Voice Pazz & Jop poll. In 2014 the LA Times called it “the most important pop album of the last 40 years”.",
collabs:[["Emil Schult","Inside-sleeve collage"],["Paul Alessandrini","Suggested the train theme"],["Karl Bartos","Sequenced percussion"],["Wolfgang Flür","Sequenced percussion"]],
echo:[["Planet Rock","Afrika Bambaataa"],["Big Booty Express","Jay Dee"]],
songs:["The opening track: a long, dreamy tribute to travelling across Europe, sung over a gently repeating synth pattern.","A slower, darker song about a young man who becomes a star and loses himself in his own reflection.","Released as a single in 1977. The band picture themselves as shop-window mannequins that come to life.","The title track and the album’s best-known song. Its rhythm imitates a train on the rails, and the lyrics mention meeting Iggy Pop and David Bowie.","Runs straight on from the title track, with clanging metallic percussion standing in for the train.","A short coda whose title is German for “departure”. On some later releases it is merged into “Metal on Metal”.","A calm instrumental named after the Austrian composer.","A brief closing reprise of “Europe Endless” that ends the album."],

genres:{n:"Electronic",c:[{n:"Techno",c:[{n:"Ambient techno"}]},{n:"IDM"}]},cover:"assets/covers/selected-ambient-works-85-92.jpg",
rec:"Richard D. James recorded the tracks himself at home in Cornwall, England, between about 1985 and 1992, some of them straight to cassette.",
tracks:[["Xtal","4:51"],["Tha","9:01"],["Pulsewidth","3:47"],["Ageispolis","5:21"],["i","1:13"],["Green Calx","6:02"],["Heliosphan","4:51"],["We Are the Music Makers","7:42"],["Schottkey 7th Path","5:07"],["Ptolemy","7:12"],["Hedphelym","6:02"],["Delphium","5:36"],["Actium","7:35"]],
trackNote:"",
making:["Aphex Twin is the best-known alias of Richard D. James. Selected Ambient Works 85–92 was his debut album, released on Apollo, an offshoot of the Belgian label R&S Records.","The music pairs soft, hazy synth pads with steady techno drum patterns, an early example of what came to be called ambient techno."],
reception:"It drew little attention at first but grew into one of the most praised electronic records of the 1990s, and it is often named as a landmark of ambient techno.",
collabs:[],echo:[],
songs:["The opening track sets the album’s tone: a muffled, steady drum loop under drifting pads and a wordless vocal.","At just over nine minutes, the longest piece on the album: a slow, hazy groove that barely changes.","One of the album’s brightest, most upbeat tracks, built on a bouncing synth line.","","The shortest track, at 1:13: a brief interlude of soft tones.","","","Its title and spoken sample come from Gene Wilder’s line in the 1971 film Willy Wonka & the Chocolate Factory, itself borrowed from Arthur O’Shaughnessy’s poem “Ode”.","","","","","The closing track ends the album on one of its busiest, most rhythmic grooves."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Selected_Ambient_Works_85%E2%80%9392">Wikipedia: Selected Ambient Works 85–92</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"endtroducing":{
release:"September 1996",label:"Mo’ Wax",
genres:{n:"Electronic",c:[{n:"Trip hop"},{n:"Instrumental hip hop"},{n:"Plunderphonics"},{n:"Sampledelia"}]},cover:"assets/covers/endtroducing.jpg",
rec:"Made between 1994 and 1996, first in DJ Shadow’s California apartment and then at the Glue Factory, the San Francisco home studio of his colleague Dan the Automator. Recording wrapped up in early 1996.",
tracks:[["Best Foot Forward","0:49"],["Building Steam with a Grain of Salt","6:40"],["The Number Song","4:40"],["Changeling / Transmission 1","7:51"],["What Does Your Soul Look Like (Part 4)","5:08"],["Untitled","0:24"],["Stem/Long Stem / Transmission 2","9:21"],["Mutual Slump","4:02"],["Organ Donor","1:57"],["Why Hip Hop Sucks in ’96","0:43"],["Midnight in a Perfect World","4:57"],["Napalm Brain/Scatter Brain","9:23"],["What Does Your Soul Look Like (Part 1 – Blue Sky Revisit) / Transmission 3","7:28"]],
trackNote:"Track 6 has no title on the album.",
making:["DJ Shadow’s debut album is built almost entirely from fragments of vinyl records. He made it over two years with very little gear: an Akai MPC60 MKII sampler, a Technics turntable and an Alesis ADAT tape recorder, with the sampler doing nearly all of the composing.","The records came from Rare Records in Sacramento, where he spent hours every day digging through the racks. He made a rule of steering clear of well-known music, cutting up obscure jazz, funk and psychedelic records along with clips from films and interviews. The cover photo was taken in that same shop.","He chose the title because the album closed a four-part run of Mo’ Wax releases that shared one sound and mood. His first attempt at the album, begun in 1994, was put out as the single “What Does Your Soul Look Like” instead, so he started again from scratch."],
reception:"British critics praised it on release and it reached number 17 on the UK Albums Chart, while interest in the US built more slowly. Robert Christgau named it the best album of 1996. Guinness World Records lists it as the first album made entirely from samples, and in 2020 Rolling Stone placed it 329th among the 500 greatest albums of all time.",
collabs:[["Dan the Automator","Hosted the sessions; assistant engineer"],["Lyrics Born","Small vocal parts; on the cover"],["Gift of Gab","Small vocal parts"],["Lisa Haugen","Small vocal parts"],["B Plus","Cover photograph"]],
echo:[["OK Computer","Radiohead"]],
songs:["A short opener stitched together from record scratches and hip hop vocal snippets.","Built on a looped piano line from Jeremy Storch’s “I Feel a New Shadow”. A drummer interview, a women’s choir, bass fills and funk guitar drift in as it goes.","Stacks several drum breaks under sampled voices counting off. The liner notes credit a sample of Metallica’s “Orion”.","Slows the pace after the upbeat opening, with new-age sounds building to a spacey ending. It runs into the first of three “Transmission” interludes, each sampled from John Carpenter’s 1987 film Prince of Darkness.","Wordless chanting over a looped bass groove. Paste’s Mark Richardson heard it as an uneasy techno soundscape.","An untitled interlude: a man tells a story about a woman and her sisters over a funk backing.","Opens the album’s second half. “Stem” sets strings against jittery drums before giving way to the airier “Long Stem”, then “Transmission 2”.","Dreamy female spoken word over prominent samples of Björk’s “Possibly Maybe”.","A sparse track that pairs an organ solo with a drum break.","A brief jab at mid-1990s commercial hip hop: a G-funk-style beat while a voice shouts “It’s the money”.","A soulful vocal over a slow beat, borrowing a bassline from Pekka Pohjola’s “The Madness Subsides” and parts of David Axelrod’s “The Human Abstract”. It was the album’s first single.","Starts with just bass and a drum loop, speeds up as more instruments pile in, then takes itself apart until only one string sample is left.","Ends the album on a brighter note with warm saxophone and keyboard hooks. The last “Transmission” closes on the words “It is happening again”, sampled from Twin Peaks."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Endtroducing.....">Wikipedia: Endtroducing.....</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"homework":{
release:"January 1997",label:"Virgin / Soma",
genres:{n:"Electronic",c:[{n:"French house"},{n:"Chicago house"},{n:"Techno"},{n:"Disco"},{n:"Electropop"}]},cover:"assets/covers/homework.jpg",
rec:"Recorded from 1994 to 1996 at Daft House, the duo’s own studio in Paris, and mastered by Nilesh Patel at the Exchange in London.",
tracks:[["Daftendirekt","2:45"],["WDPK 83.7 FM","0:28"],["Revolution 909","5:26"],["Da Funk","5:30"],["Phoenix","4:57"],["Fresh","4:03"],["Around the World","7:10"],["Rollin’ & Scratchin’","7:28"],["Teachers","2:53"],["High Fidelity","6:03"],["Rock’n Roll","7:33"],["Oh Yeah","2:03"],["Burnin’","6:53"],["Indo Silver Club","4:35"],["Alive","5:15"],["Funk Ad","0:51"]],
trackNote:"",
making:["Homework is the debut album of Daft Punk, the Paris duo of Thomas Bangalter and Guy-Manuel de Homem-Christo. Their early singles on the Scottish label Soma set off a bidding war between record companies, and they signed with Virgin in 1996.","They never planned an album: after five months of making tracks, they realised they already had one. The running order was set to fill the four sides of a double vinyl LP, and the title nods to the record being made at home, cheaply, quickly and on impulse.","Staying in control mattered to them more than money. They paid for the work themselves, and through their own Daft Trax label they still own the master recordings, while Virgin handles distribution."],
reception:"It charted in 14 countries, peaking at number 3 in France and number 8 in the UK, and had sold more than two million copies by February 2001. “Da Funk” and “Around the World” both topped the US dance club chart. In 2012 Rolling Stone named it the greatest EDM album of all time, and it brought French house to listeners around the world.",
collabs:[["Spike Jonze","Directed the “Da Funk” video"],["DJ Deelat & DJ Crabbe","Featured on “Oh Yeah”"],["Nicolas Hidiroglou","Cover and inner-sleeve photography"],["Nilesh Patel","Mastering"]],
echo:[["The Avalanches","Inspired by “Da Funk”"]],
songs:["A clip of a live set recorded in Ghent, Belgium, at the first I Love Techno event in November 1995. It opened their concerts, so it opens the album too.","A short tribute to American FM radio.","A comment on how the French government treated dance music. It was the album’s final single, released in 1998.","Funk meets acid over a bouncing funk guitar, with a sample of Vaughan Mason & Crew’s “Bounce, Rock, Skate, Roll”. It became Daft Punk’s first number one on the US dance club chart.","Mixes gospel with house and samples Elton John and Kiki Dee’s “Don’t Go Breaking My Heart”.","A light, breezy track the duo thought of as comic in its structure. It samples Viola Wills’s version of “If You Leave Me Now”.","Nods to Gershon Kingsley’s “Popcorn” over a post-disco bassline, with one hook repeated over and over. It reached number 5 in the UK and number 61 on the Billboard Hot 100.","One of the duo’s early tracks, first released on Soma in 1995.","A riff on Parris Mitchell’s “Ghetto Shout Out!!” that salutes their house music heroes, among them Romanthony, DJ Sneak and Todd Edwards.","","","Features DJ Deelat and DJ Crabbe.","The album’s fourth single, released in September 1997. It reached number 30 in the UK.","Samples Karen Young’s “Hot Shot”. Soma first put it out in two parts with no artist credit, so people believed it was made by producers called Indo Silver Club.","The final version of “The New Wave”, Daft Punk’s first single.","A short closer: “Da Funk” played backwards."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Homework_(Daft_Punk_album)">Wikipedia: Homework (Daft Punk album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

genres:{n:"Electronic",c:[{n:"IDM"},{n:"Ambient"},{n:"Downtempo"},{n:"Trip hop"},{n:"Psychedelia"}]},cover:"assets/covers/music-has-the-right-to-children.jpg",
rec:"Recorded between 1995 and 1997 at Hexagon Sun, the duo’s own studio in the Pentland Hills, Scotland. The press liked to call it a bunker; the band said that was just the label exaggerating.",
tracks:[["Wildlife Analysis","1:15"],["An Eagle in Your Mind","6:25"],["The Color of the Fire","1:45"],["Telephasic Workshop","6:35"],["Triangles & Rhombuses","1:50"],["Sixtyten","5:48"],["Turquoise Hexagon Sun","5:07"],["Kaini Industries","0:59"],["Bocuma","1:35"],["Roygbiv","2:31"],["Rue the Whirl","6:39"],["Aquarius","5:58"],["Olson","1:31"],["Pete Standing Alone","6:07"],["Smokes Quantity","3:07"],["Open the Light","4:25"],["One Very Important Thought","1:25"]],
trackNote:"The 1998 US and 2004 UK editions add a bonus track, “Happy Cycling” (7:51).",
making:["Boards of Canada are the brothers Michael Sandison and Marcus Eoin, who had been making music together since 1981. This is their debut album. After Autechre’s Sean Booth heard their Hi Scores EP, he pointed them to Skam Records. Warp wanted the album too, so the two labels released it together.","The sound comes from samplers, deliberately detuned vintage synthesisers, drum machines and reel-to-reel tape, mixed with found sounds, samples and hip-hop-style beats. Several samples come from the children’s programme Sesame Street.","The track titles hide cryptic, often personal references. The album title points to the duo’s aim to affect listeners through sound, and the cover is a doctored family photo taken at Banff Springs in Alberta, Canada."],
reception:"Critics liked it from the start, and it is now seen as a landmark of electronic music. Pitchfork ranked it 26th among the best albums of the 1990s and second among the best IDM albums ever. Fact magazine listed musicians it directly shaped, including Four Tet, Bibio, Gold Panda and Tim Hecker.",
collabs:[["Sean Booth","Of Autechre; pointed them to Skam"]],
echo:[["Four Tet","Influenced by the album"],["Bibio","Influenced by the album"],["Gold Panda","Influenced by the album"],["Tim Hecker","Influenced by the album"]],
songs:["","","A minimal piece, likened to Brian Eno’s work, built around a looped child’s voice warped into an eerie, one-sided conversation. It uses samples from Sesame Street.","Released as a single in 1998, paired with “Roygbiv”.","","","","","","Released as a single in 1998, paired with “Telephasic Workshop”.","The studio window was left open while it was recorded, so birdsong ended up on the tape. The duo liked the effect and kept it.","The album’s first single, released in January 1998. It also borrows from Sesame Street.","","Named after the main character of Circle of the Sun, a 1960 documentary by Colin Low for the National Film Board of Canada.","First released on the duo’s 1995 EP Twoism.","",""],

"untrue":{
release:"November 2007",label:"Hyperdub",
genres:{n:"Electronic",c:[{n:"Dubstep"},{n:"UK garage"},{n:"Ambient"}]},cover:"assets/covers/untrue.jpg",
rec:"Burial made the album in 2007 with the audio editing program Sound Forge, working mostly in the dead of night.",
tracks:[["Untitled","0:46"],["Archangel","3:58"],["Near Dark","3:54"],["Ghost Hardware","4:53"],["Endorphin","2:57"],["Etched Headplate","5:59"],["In McDonalds","2:07"],["Untrue","6:16"],["Shell of Light","4:40"],["Dog Shelter","2:59"],["Homeless","5:20"],["UK","1:40"],["Raver","4:59"]],
trackNote:"CD edition. Track 1 has no title. The 2007 vinyl uses a shorter running order without some of the beatless pieces.",
making:["Untrue is the second album by Burial, the British producer later revealed to be William Bevan. He first made a batch of darker, more technical tracks, grew tired of them and threw them out. Then he set out to make a glowing, buzzing record fast, to cheer himself up.","He wanted voices at the heart of it, inspired by producers such as A Guy Called Gerald, Foul Play and Omni Trio. With no session singer, he had friends sing down the phone and cut up a cappella samples word by word, pitch-shifting and stretching them until male and female voices blurred together.","Around the voices he layered rain, vinyl crackle and stray sounds from odd places, including the video game Metal Gear Solid and the jangle of car keys from a Vin Diesel film. Angels and ghosts run through the titles, meant for people who get knocked about by life but carry themselves with grace."],
reception:"Critics loved it: Metacritic gave it an average of 90 and ranked it the joint most acclaimed album of 2007. It was nominated for the 2008 Mercury Prize, and in 2017 Simon Reynolds, writing in Pitchfork, called it the most important electronic album of the century so far. Its success led Burial to drop his anonymity.",
collabs:[["Kode9","Hyperdub owner; premiered it on BBC Radio 1"]],
echo:[],
songs:["A 46-second untitled opener.","One of the album’s fast tracks, with skittering beats. It was the first single and reached number 21 on the Flanders Ultratip chart.","Another uptempo track with skittering beats.","A showcase of Burial’s crackle, shuffling drums and warped vocal samples. It first came out on an EP of the same name in June 2007, then was the UK iTunes free single of the week that December.","A beatless interlude: lone vocal samples floating over ambience.","","Another beatless interlude built on isolated vocal samples and ambience.","","","","","",""],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Untrue_(album)">Wikipedia: Untrue (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"random-access-memories":{
release:"May 2013",label:"Columbia",
genres:{n:"Electronic",c:[{n:"Disco"},{n:"Funk"},{n:"Soft rock"},{n:"Progressive pop"}]},cover:"assets/covers/random-access-memories.jpg",
rec:"Recorded in secret from 2008 to 2012 at Henson, Conway and Capitol Studios in California, Electric Lady Studios in New York City and Gang Recording Studio in Paris. Most vocals were done in Paris and the rhythm sections in the US.",
tracks:[["Give Life Back to Music","4:34"],["The Game of Love","5:22"],["Giorgio by Moroder","9:04"],["Within","3:48"],["Instant Crush","5:37"],["Lose Yourself to Dance","5:53"],["Touch","8:19"],["Get Lucky","6:09"],["Beyond","4:50"],["Motherboard","5:41"],["Fragments of Time","4:39"],["Doin’ It Right","4:11"],["Contact","6:23"]],
trackNote:"Japanese editions add a bonus track, “Horizon” (4:25).",
making:["Daft Punk’s fourth and final studio album is a tribute to late-1970s and early-1980s American music, especially from Los Angeles. Tired of building tracks from samples and loops, the duo asked arranger Chris Caswell to gather veteran session players, so they could do with people what they used to do with machines.","Electronics were kept to drum machines on just two tracks, a large custom modular synthesizer and vintage vocoders. Every session went onto both tape and Pro Tools, and the duo picked whichever version they preferred. They paid for it all themselves; Bangalter put the cost at over a million dollars.","The title links computer memory with human memory and the random way memories get stored. The guests include Nile Rodgers, Giorgio Moroder, Pharrell Williams, Julian Casablancas, Paul Williams, Panda Bear, Todd Edwards, Chilly Gonzales and DJ Falcon."],
reception:"It is Daft Punk’s only album to top the US Billboard 200, and it hit number one in twenty other countries too. At the 2014 Grammys it won Album of the Year, Best Dance/Electronica Album and Best Engineered Album, Non-Classical, and “Get Lucky” took Record of the Year. Its Metacritic score of 87 is the highest of any Daft Punk album, though Pitchfork later lowered its own rating.",
collabs:[["Nile Rodgers","Appears on three songs, including “Get Lucky”"],["Pharrell Williams","Vocals on two tracks"],["Giorgio Moroder","Spoken monologue"],["Julian Casablancas","Vocals on “Instant Crush”"],["Paul Williams","Lyrics and vocals on “Touch”"],["Panda Bear","Vocals on “Doin’ It Right”"],["Todd Edwards","Co-wrote “Fragments of Time”"],["Chilly Gonzales","Piano"],["DJ Falcon","Co-produced “Contact”"],["Chris Caswell","Arranger and keyboards"]],
echo:[["Life Is But a Dream...","Avenged Sevenfold"]],
songs:["Opens with guitar from Nile Rodgers and Paul Jackson Jr., keyboards by Chilly Gonzales, drums by John “J.R.” Robinson and vocoder vocals from the duo. NME heard a huge rock intro that wiped out any trace of their earlier brittle techno.","More vocoder vocals, this time trying to make a robot voice sound expressive and full of feeling.","Giorgio Moroder tells the story of his life, including how he made Donna Summer’s “I Feel Love”, and the duo turned it into a metaphor for musical freedom. Bangalter hummed the drum and bass line to drummer Omar Hakim, who played it back and improved on it.","One of the first tracks recorded: Chilly Gonzales on piano with light bass, percussion, keys and vocoder. It shifts the album from A minor into B-flat minor.","Julian Casablancas of the Strokes sings, joining two of the duo’s demos into one song as verse and chorus. It has rock touches and a guitar solo.","Pharrell Williams sings over live drums, while a vocoder chants “come on”.","Lyrics and vocals by Paul Williams. With more than 250 separate elements, it was the album’s most complex piece, and Homem-Christo called it the core of the record.","The lead single, sung by Pharrell Williams. It topped the charts in more than 30 countries and won the Grammy for Record of the Year.","Paul Williams turned the duo’s ideas into lyrics. It opens with strings and timpani before settling into a groove.","The duo described it as a futuristic piece that could come from the year 4000.","Todd Edwards wrote the lyrics about moments from the California sessions and added his signature cut-up production for the chorus, which Bangalter said helped save the song.","The last song recorded, made with Panda Bear over four days. The duo called it the album’s only purely electronic track.","Co-produced by DJ Falcon. It samples the Sherbs’ “We Ride Tonight” and NASA audio of astronaut Eugene Cernan describing a flashing object seen from Apollo 17."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Random_Access_Memories">Wikipedia: Random Access Memories</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"switched-on-bach":{
release:"October 1968",label:"Columbia Masterworks",
genres:{n:"Electronic",c:[{n:"Baroque"}]},cover:"assets/covers/switched-on-bach.jpg",
rec:"Recorded in 1967–1968, mostly in Carlos’s rented studio apartment on Manhattan’s West Side, on an 8-track machine she built from Ampex parts. The first piece, the Invention in F major, was taped in spring 1967 at Gotham Recording Studios.",
tracks:[["Sinfonia to Cantata No. 29","3:20"],["Air on a G String","2:27"],["Two-Part Invention in F Major","0:40"],["Two-Part Invention in B-Flat Major","1:30"],["Two-Part Invention in D Minor","0:55"],["Jesu, Joy of Man’s Desiring","2:56"],["Prelude and Fugue No. 7 in E-Flat Major","7:07"],["Prelude and Fugue No. 2 in C Minor","2:43"],["Chorale Prelude ‘Wachet Auf’","3:37"],["Brandenburg Concerto No. 3 in G Major – First Movement","6:35"],["Brandenburg Concerto No. 3 in G Major – Second Movement","2:50"],["Brandenburg Concerto No. 3 in G Major – Third Movement","5:05"]],
trackNote:"Tracks 1–7 are side one and 8–12 are side two. All music by Johann Sebastian Bach.",
making:["Wendy Carlos’s debut album plays music by Johann Sebastian Bach on a Moog synthesizer, with help from Benjamin Folkman. Carlos and Rachel Elkind produced it. Carlos wanted to prove the new machine could make appealing music you could really listen to, not just the harsh sounds of the avant-garde.","The Moog could only play one note at a time, so every track was built up note by note. It kept drifting out of tune and had to be checked again every few notes. The whole album took about five months and a thousand hours.","The first pressing showed a seated Bach with no credit for Carlos. She and Elkind found it silly and had it replaced, not least because the headphones in the photo were plugged into the wrong socket. After Carlos came out as a transgender woman in 1979, reissues updated her name."],
reception:"Some classical purists disliked it, but younger listeners took to it. It reached number 10 on the Billboard 200, topped the classical chart from 1969 to 1972, sold over a million copies and won three Grammys in 1970. Pianist Glenn Gould praised it, and it joined the Library of Congress National Recording Registry in 2005.",
collabs:[["Benjamin Folkman","Supplementary keyboards"],["Rachel Elkind","Producer"],["Robert Moog","Designed the synthesizer"],["Ettore Stratta","Championed it at Columbia"]],
echo:[["The Beach Boys Love You","The Beach Boys"],["Switched-On Rock","The Moog Machine"],["Music to Moog By","Gershon Kingsley"]],
songs:["","","The first piece recorded for the album, in spring 1967. Carlos had already played a Moog version of it to Rachel Elkind before the album was planned.","","","","From Book 1 of The Well-Tempered Clavier.","From Book 1 of The Well-Tempered Clavier.","","Elkind was so impressed by Carlos’s recording of this concerto that she became the album’s producer.","Bach wrote only two chords here and left the players to improvise. Carlos and Folkman built it out carefully to show what the Moog could do.","Robert Moog played this movement at the end of a talk to the Audio Engineering Society in 1968, and the tape got a standing ovation."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Switched-On_Bach">Wikipedia: Switched-On Bach</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"i-feel-love":{
release:"July 1977",label:"Casablanca",
genres:{n:"Electronic",c:[{n:"Synth-pop"},{n:"Eurodisco"},{n:"Dance"}]},cover:"assets/covers/i-feel-love.jpg",
rec:"Recorded in 1976 at Musicland Studios in Munich, West Germany, on a 16-track tape machine. The Moog drifted out of tune so quickly that it had to be recorded in bursts of 20 or 30 seconds.",
tracks:[["I Feel Love","5:53"],["Can’t We Just Sit Down (And Talk It Over)","4:25"]],
trackNote:"US 7-inch single. There is also a 3:45 seven-inch edit and an 8:15 twelve-inch version.",
making:["Donna Summer recorded the song for her 1977 album I Remember Yesterday, produced and co-written by Giorgio Moroder and Pete Bellotte. Each track on that album was meant to recall a different decade; for this closing track, the team aimed for the future.","Where most disco used orchestras, they used a Moog synthesizer borrowed from composer Eberhard Schoener. His assistant Robby Wedel showed them how to sync it with a click track, and Moroder later called him the unsung hero. Apart from the vocals, only the kick drum, played by Keith Forsey, came from a person.","Summer sang it in one take, in a light head voice instead of the chest voice usual in disco. It was the first song to combine looping synth patterns with a steady four-on-the-floor kick and an off-beat hi-hat, the formula techno and house took up ten years later."],
reception:"It first came out as a B-side and was reissued two months later as the A-side. It spent four weeks at number one in the UK, topped the charts in Australia, Belgium, France, Italy and the Netherlands, and reached number six in the US. Brian Eno told David Bowie he had heard the sound of the future, and in 2011 it joined the National Recording Registry.",
collabs:[["Giorgio Moroder","Producer and co-writer"],["Pete Bellotte","Producer, co-writer and lyrics"],["Robby Wedel","Helped run the Moog"],["Eberhard Schoener","Lent the Moog synthesizer"],["Keith Forsey","Kick drum"]],
echo:[["Summer Renaissance","Beyoncé"],["I Feel Love","Bronski Beat"],["I Feel Love","Sam Smith"]],
songs:["Moroder wrote the backing track and bassline before the melody. Each bass note is doubled by a delay, one copy in each speaker, which gives the song its flickering, strobe-like pulse.","The single’s original A-side, with “I Feel Love” on the back before the sides were swapped. It reached number 20 on the US R&B chart."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/I_Feel_Love">Wikipedia: I Feel Love</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"music-for-airports":{
release:"February 1979",label:"E.G. / Polydor",
genres:{n:"Electronic",c:[{n:"Ambient"},{n:"Minimalist"}]},cover:"assets/covers/music-for-airports.jpg",
rec:"Recorded in December 1978 in London and at Conny Plank’s studio in Cologne. Eno began it while producing David Bowie’s Low, taping single notes sung by three German singers at Plank’s studio, then added Fred Frith on guitar and Robert Wyatt on piano back in England.",
tracks:[["1/1","16:30"],["2/1","8:20"],["1/2","11:30"],["2/2","6:00"]],
trackNote:"Each title is track/side, so “2/1” is the second track on side one. On CD, “2/2” runs 9:38.",
making:["Brian Eno had the idea after hours stuck at Cologne Bonn Airport, irritated by its atmosphere. He pictured calming music for airports: not Muzak that smooths a space over, but sound that leaves room to think and can be ignored as easily as it can be listened to.","The four pieces are made from tape loops of keyboards and voices cut to different lengths, so they drift in and out of step with one another. The album was meant to loop endlessly as a sound installation.","It was the first album Eno released under the name ambient music, and it made the term popular. A nervous flyer himself, Eno wanted it to comfort people, even to resign them to the possibility of death."],
reception:"Many critics first found it dull, and Robert Christgau later called it a bore. Opinion warmed by the 1990s: Rolling Stone credited it with defining the ambient genre, and in 2016 Pitchfork named it the best ambient album of all time. It has sold over 200,000 copies.",
collabs:[["Robert Wyatt","Acoustic piano"],["Christa Fast","Vocals"],["Christine Gomez","Vocals"],["Inge Zeininger","Vocals"],["Conny Plank","Engineer on “2/2”"],["Rhett Davies","Engineer and co-writer on “1/1”"]],
echo:[["Music for Real Airports","The Black Dog"],["Eno Piano","Bruce Brubaker"]],
songs:["Piano loops played without a steady rhythm, from two pianists improvising who could not clearly hear each other. It is the only track with a melody.","Loops of the singers’ voices, cut to different lengths and left to fall into their own patterns. Music professor Victor Szabo called it ghostly.","More vocal loops, now with acoustic piano, in a colder and darker tone than the warm opener.","Played on an ARP 2600 synthesiser, slowed down and treated with three kinds of echo."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Ambient_1:_Music_for_Airports">Wikipedia: Ambient 1: Music for Airports</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"blue-monday":{
release:"March 1983",label:"Factory",
genres:{n:"Electronic",c:[{n:"Synth-pop"},{n:"Eurodisco"},{n:"Alternative dance"},{n:"Hi-NRG"},{n:"Dance-pop"}]},cover:"assets/covers/blue-monday.jpg",
rec:"Recorded in 1982 at Britannia Row in Islington, after the band wrote it in their rehearsal room in Cheetham Hill, Manchester.",
tracks:[["Blue Monday","7:29"],["The Beach","7:19"]],
trackNote:"Original 1983 12-inch single, FAC 73.",
making:["New Order formed in 1980 from the remaining members of Joy Division and began exploring synthesisers. The bassline runs on a Moog Source driven by a sequencer singer Bernard Sumner built himself, with an Oberheim DMX drum machine for the beat.","This was before MIDI, so engineer Martin Usher designed a circuit to keep the machines in sync. Gillian Gilbert wrote the sequence out by hand and accidentally added an extra rest, nudging it slightly off time. The band liked it and kept it. The choir sounds were sampled from Kraftwerk’s “Uranium”.","The sleeve, by Peter Saville and Brett Wickens, looks like a floppy disk and spells out the details only in coloured blocks. It was so costly to make that Factory lost money on every copy sold."],
reception:"It reached number nine in the UK and spent 186 weeks on the indie chart. It is the best-selling 12-inch single in history, with 1.16 million sold in the UK across all formats. It went on to influence the Detroit techno scene and Pet Shop Boys, and Rolling Stone ranked it 18th among the greatest dance songs of all time.",
collabs:[["Peter Saville","Sleeve design"],["Brett Wickens","Sleeve design"],["Martin Usher","Built the sync circuit"]],
echo:[["Shut Up and Drive","Rihanna"],["Can’t Get Blue Monday Out of My Head","Kylie Minogue"]],
songs:["Opens with a rapid kick drum before the sequence arrives, and skips the usual verse-chorus shape: a long intro, back-to-back verses, a short breakdown and an extended outro.","The B-side: a mostly instrumental version of “Blue Monday”."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Blue_Monday_(New_Order_song)">Wikipedia: Blue Monday (New Order song)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"paranoid":{
release:"September 1970",label:"Vertigo / Warner Bros.",
genres:{n:"Metal",c:[{n:"Heavy metal"}]},cover:"assets/covers/paranoid.jpg",
rec:"Recorded over 16–18 June 1970 at Regent Sound and Island Studios in London, with producer Rodger Bain.",
tracks:[["War Pigs","7:57"],["Paranoid","2:48"],["Planet Caravan","4:32"],["Iron Man","5:56"],["Electric Funeral","4:53"],["Hand of Doom","7:08"],["Rat Salad","2:30"],["Fairies Wear Boots","6:15"]],
trackNote:"North American copies used longer titles for two tracks: “War Pigs / Luke’s Wall” and “Jack the Stripper / Fairies Wear Boots”.",
making:["Black Sabbath’s second album followed fast on the success of their debut: the band were back in the studio just four months later. Most of the songs grew out of long onstage jams, many of them at a Zurich club in late 1969, where the band played seven 45-minute sets a day for six weeks.","The title track was an afterthought, knocked out in minutes because the album was a song short. The record was meant to be called War Pigs, but the label renamed it after the hit single. The cover, a sword-wielding figure in a helmet shot in Black Park, Buckinghamshire, had already been made for the old title, which is why it doesn’t match.","Geezer Butler wrote most of the lyrics. While other bands sang about flowers in their hair, Sabbath turned to war, nuclear fear, addiction and despair."],
reception:"It went to number one in the UK, reached number 12 in the US with almost no radio play, and the title track became a number four UK hit. In 2017 Rolling Stone named it the greatest metal album of all time, and AllMusic said it defined heavy metal more than any other record.",
collabs:[["Rodger Bain","Producer"],["Tom Allom","Engineer; piano on “Planet Caravan”"],["Keith McMillan (Keef)","Cover photography and design"],["Roger Brown","Model on the cover"]],
echo:[["Metallica","Owes a debt to it, says Rolling Stone"],["Nirvana","Owes a debt to it, says Rolling Stone"],["Slipknot","Owes a debt to it, says Rolling Stone"]],
songs:["First called “Walpurgis”. Butler reworked it into an attack on warmongers, whom he saw as the real Satanists: the powerful who send the working class off to fight their wars. It grew out of a club jam.","Written in about twenty minutes to fill out the album. Butler said the lyrics are really about depression. It reached number four in the UK, the band’s biggest hit single.","An unusually quiet song about drifting through space with a loved one. Ozzy Osbourne sings through a Leslie speaker, and Tony Iommi’s guitar shows the influence of Django Reinhardt.","First called “Iron Bloke”, after Osbourne said Iommi’s riff sounded like a big iron man walking around. The lyrics tell of a time traveller who sees the apocalypse, is turned to steel, and takes revenge when no one believes his warning.","Apocalyptic images of nuclear war, written in reaction to the peace-and-love mood of the time.","About soldiers coming home from Vietnam hooked on heroin, which the band saw at US Army bases. Butler said the song is against drugs, not for them.","Bill Ward’s drum solo, born from early gigs where the band had to fill long sets. The title came from a joke about Ward’s uncombed hair.","The closer, with lyrics by Osbourne about a nasty run-in with a gang of skinheads."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Paranoid_(album)">Wikipedia: Paranoid (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"master-of-puppets":{
release:"March 1986",label:"Elektra",
genres:{n:"Metal",c:[{n:"Thrash metal"}]},cover:"assets/covers/master-of-puppets.jpg",
rec:"Recorded from September 1 to December 27, 1985, at Sweet Silence Studios in Copenhagen, Denmark, with producer Flemming Rasmussen. Michael Wagener finished the mix in January 1986.",
tracks:[["Battery","5:13"],["Master of Puppets","8:36"],["The Thing That Should Not Be","6:37"],["Welcome Home (Sanitarium)","6:28"],["Disposable Heroes","8:17"],["Leper Messiah","5:40"],["Orion","8:28"],["Damage, Inc.","5:33"]],
trackNote:"All lyrics by James Hetfield.",
making:["Metallica’s third album was written mainly by James Hetfield and Lars Ulrich in a garage in El Cerrito, California. Unhappy with the sound of American studios, the band recorded in Ulrich’s native Denmark, arriving with well-prepared demos. They stayed sober on recording days and avoided the slick sound and synths of the glam metal around them.","The songs are about control and the abuse of power: addiction, war, madness and blind faith. Don Brautigam’s cover, white crosses on strings pulled by hands in a blood-red sky, sums up that theme. The band also mocked the new parental warning stickers with a joke label of their own.","It was the last album with bassist Cliff Burton, whose classical training shaped the arrangements. He was killed in September 1986 when the band’s tour bus crashed in Sweden."],
reception:"It reached number 29 on the Billboard 200 with almost no radio play or videos, and became thrash metal’s first platinum album; in 2025 it was certified 8× platinum in the US. In 2015 it became the first metal recording chosen for the Library of Congress National Recording Registry.",
collabs:[["Flemming Rasmussen","Producer"],["Michael Wagener","Mixing"],["Don Brautigam","Painted the cover"],["Peter Mensch","Co-designed the cover"]],
echo:[["Master of Puppets: Remastered","Kerrang! tribute album, 2006"]],
songs:["Opens with layered acoustic guitars before crashing into fast, aggressive riffing. Hetfield came up with the riff while relaxing in London. The title points to violence, as in “assault and battery”.","Sung from the point of view of addiction, specifically cocaine. Odd-metered riffs surround a clean, melodic middle section, and it quotes a riff from David Bowie’s “Andy Warhol”. It became Metallica’s most-played song live, and its use in the fourth season of Stranger Things brought it a new wave of listeners.","Inspired by H. P. Lovecraft’s Cthulhu stories. Its slow, down-tuned, Black Sabbath-style riff imitates a beast dragging itself into the sea, and it is considered the album’s heaviest track.","Based on Ken Kesey’s One Flew Over the Cuckoo’s Nest, it voices a patient wrongly locked in an asylum. Quiet verses switch to heavy choruses before an aggressive finale.","An anti-war song about a young soldier whose fate lies with his superiors. Parts of it run at 220 beats per minute, among the most intense moments on the record.","Takes aim at 1980s TV evangelists and the followers who obey them blindly. The title comes from David Bowie’s “Ziggy Stardust”.","A multi-part instrumental built around Cliff Burton’s bass, which opens processed to sound like an orchestra. Burton arranged its moody middle section.","A rant about senseless violence. It opens with reversed bass chords based on Bach’s “Come, Sweet Death”, then breaks into a riff Kirk Hammett says owes something to Deep Purple."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Master_of_Puppets">Wikipedia: Master of Puppets</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"reign-in-blood":{
release:"October 1986",label:"Def Jam / Geffen",
genres:{n:"Metal",c:[{n:"Thrash metal"}]},cover:"assets/covers/reign-in-blood.jpg",
rec:"Recorded from January to March 1986 at Hit City West in Los Angeles, with Rick Rubin producing and Andy Wallace engineering.",
tracks:[["Angel of Death","4:51"],["Piece by Piece","2:02"],["Necrophobic","1:40"],["Altar of Sacrifice","2:50"],["Jesus Saves","2:54"],["Criminally Insane","2:23"],["Reborn","2:11"],["Epidemic","2:23"],["Postmortem","3:27"],["Raining Blood","4:14"]],
trackNote:"The whole album runs just under 29 minutes.",
making:["Slayer’s third album was their first on Def Jam, then mainly a hip hop label, and their first with producer Rick Rubin. Drummer Dave Lombardo reached out to Rubin himself, and Rubin then talked the band into signing.","Rubin had never produced metal before and came at it fresh. He stripped out the reverb the band had always used, so every fast note could be heard; Kerry King said it made the music sound far more threatening. The songs average about 220 beats per minute.","The songs are short because the band got bored repeating riffs, not by design. When Rubin pointed out how brief the album was, the band simply answered, “So what?” The whole record fits on one side of a cassette."],
reception:"It was Slayer’s first album to enter the Billboard 200, peaking at number 94, and went gold in the US in 1992. Kerrang! called it the heaviest album of all time, and along with Master of Puppets and others it is credited with defining the sound of American thrash. In 2017 Rolling Stone ranked it sixth among the greatest metal albums.",
collabs:[["Rick Rubin","Producer"],["Andy Wallace","Engineer"],["Larry Carroll","Cover painting"],["Glen E. Friedman","Band photographs"]],
echo:[["Cannibal Corpse","Drummer credits Lombardo’s playing here"],["Necro","Heavily influenced by the album"]],
songs:["About Josef Mengele and his crimes at Auschwitz, written by Jeff Hanneman after reading books about him. Because of it, Columbia refused to distribute the album, and Geffen released it without its own logo. The band denied any Nazi sympathy. It opens with Tom Araya’s scream, Hanneman’s idea.","","","Gwar singer Oderus Urungus named it his favourite Slayer song.","","A remix was released as a single in 1987.","","","Released as a single in 1986.","Along with “Angel of Death”, it became a near-permanent part of Slayer’s live show. On the 2004 tour where they played the whole album, it ended with the band drenched in fake blood."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Reign_in_Blood">Wikipedia: Reign in Blood</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"the-number-of-the-beast":{
release:"March 1982",label:"EMI",
genres:{n:"Metal",c:[{n:"Heavy metal"}]},cover:"assets/covers/the-number-of-the-beast.jpg",
rec:"Recorded in 1981 at Battery Studios in London with producer Martin Birch. Recording and mixing had to be squeezed into just five weeks.",
tracks:[["Invaders","3:20"],["Children of the Damned","4:34"],["The Prisoner","6:03"],["22 Acacia Avenue","6:34"],["The Number of the Beast","4:25"],["Run to the Hills","3:50"],["Gangland","3:46"],["Hallowed Be Thy Name","7:08"]],
trackNote:"The 1998 CD reissue adds “Total Eclipse”, first released as the B-side of “Run to the Hills”.",
making:["Iron Maiden’s third album was the first with singer Bruce Dickinson, whose range let Steve Harris write more ambitious songs, and the last with drummer Clive Burr. Dickinson helped write several tracks but could not be credited because of a contract dispute involving his old band, Samson.","With almost nothing written beforehand, the band built the album from scratch and ran short of time. The music press reported strange goings-on at the studio, ending with producer Martin Birch crashing into a minibus full of nuns and getting a repair bill for £666.","Derek Riggs’s cover shows the band’s mascot Eddie working Satan like a puppet, while Satan works a smaller Eddie. In the US, some religious groups called the band Satanists, burning or smashing their records and protesting outside their shows."],
reception:"It was Iron Maiden’s first UK number one album and their first to reach the US top 40, and “Run to the Hills” gave them their first top-ten UK single. AllMusic called it a cornerstone of heavy metal, and by 2023 it had sold around 20 million copies worldwide.",
collabs:[["Martin Birch","Producer"],["Derek Riggs","Cover painting"],["Barry Clayton","Spoken intro on the title track"],["Patrick McGoohan","Allowed The Prisoner dialogue to be used"]],
echo:[["Bigger than the Devil","Stormtroopers of Death"],["Hallowed Be Thy Name","Iced Earth"],["The Number of the Beast","Djali Zwan"]],
songs:["The opener. Steve Harris later admitted it wasn’t strong enough, but there was nothing else ready to replace it.","Based on the films Village of the Damned and Children of the Damned, adapted from John Wyndham’s novel The Midwich Cuckoos. Dickinson said Black Sabbath’s “Children of the Sea” inspired it.","Inspired by the British TV series The Prisoner, and uses dialogue from its title sequence. Actor Patrick McGoohan gave his permission over the phone.","The second chapter of the band’s “Charlotte the Harlot” saga. Adrian Smith first wrote it years earlier with his old band, Urchin.","Inspired by a nightmare Harris had after watching Damien: Omen II late at night. It opens with actor Barry Clayton reading from the Book of Revelation; the band had first wanted Vincent Price but would not pay his fee.","Released in February 1982 ahead of the album, it became the band’s first top-ten UK single.","Several band members later wished they had put “Total Eclipse” on the album in its place.","The tale of a prisoner about to be hanged, with some of Harris’s most philosophical lyrics. It has stayed in nearly every Iron Maiden setlist since."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/The_Number_of_the_Beast_(album)">Wikipedia: The Number of the Beast (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"painkiller":{
release:"September 1990",label:"Columbia",
genres:{n:"Metal",c:[{n:"Heavy metal"},{n:"Speed metal"}]},cover:"assets/covers/painkiller.jpg",
rec:"Recorded in early 1990 at Miraval Studios in France and mixed at Wisseloord Studios in Hilversum, the Netherlands, produced by the band with Chris Tsangarides.",
tracks:[["Painkiller","6:06"],["Hell Patrol","3:35"],["All Guns Blazing","3:56"],["Leather Rebel","3:34"],["Metal Meltdown","4:46"],["Night Crawler","5:44"],["Between the Hammer & the Anvil","4:47"],["A Touch of Evil","5:42"],["Battle Hymn","0:56"],["One Shot at Glory","6:46"]],
trackNote:"The 2001 remaster adds “Living Bad Dreams” and a live “Leather Rebel”.",
making:["Judas Priest’s twelfth album was the first with drummer Scott Travis, formerly of Racer X, whose heavy double-kick drumming gave the band a faster, heavier edge. It was also the last with singer Rob Halford until 2005.","It was the band’s first album with producer Chris Tsangarides since 1976, ending a long run with Tom Allom. Don Airey added keyboards to “A Touch of Evil” and quietly doubled most of the bass parts on a Minimoog.","The album was finished in March 1990 but held back until the band’s subliminal-messages trial was over. They had been sued over the suicide attempts of two young men in 1985, and the case was dismissed in August 1990."],
reception:"It went gold in the US and was nominated for the Grammy for Best Metal Performance, losing to Metallica. AllMusic called it one of the band’s best in years and likened the comeback to George Foreman’s. After the tour, Halford left the band in 1992.",
collabs:[["Chris Tsangarides","Co-producer"],["Don Airey","Keyboards and Minimoog bass"],["Mark Wilkinson","Cover illustration"]],
echo:[],
songs:["The title track and lead single, released in September 1990. It became one of the band’s concert staples.","Returned to the band’s setlist on later tours.","Returned to the band’s setlist on later tours.","Dropped from the live show after only a few performances in 1990.","Dropped from the live show after only a few performances in 1990.","Returned to the band’s setlist on later tours.","Returned to the band’s setlist on later tours.","The only track with keyboards, played by Don Airey, and the only one co-written by Chris Tsangarides. It was the second single, released in March 1991.","A short instrumental that leads into “One Shot at Glory”. Neither was played live until August 2021.","First played live in August 2021, at the Bloodstock Open Air festival."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Painkiller_(Judas_Priest_album)">Wikipedia: Painkiller (Judas Priest album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"rust-in-peace":{
release:"September 1990",label:"Capitol",
genres:{n:"Metal",c:[{n:"Thrash metal",c:[{n:"Technical thrash metal"}]},{n:"Heavy metal"}]},cover:"assets/covers/rust-in-peace.jpg",
rec:"Recorded in 1989–1990 at Rumbo Recorders in Canoga Park, California. Mike Clink produced the first half while Dave Mustaine was in rehab; engineer Micajah Ryan finished the guitars and vocals, and Max Norman mixed it.",
tracks:[["Holy Wars... The Punishment Due","6:36"],["Hangar 18","5:14"],["Take No Prisoners","3:28"],["Five Magics","5:42"],["Poison Was the Cure","2:58"],["Lucretia","3:58"],["Tornado of Souls","5:22"],["Dawn Patrol","1:50"],["Rust in Peace... Polaris","5:36"]],
trackNote:"",
making:["Megadeth’s fourth album introduced guitarist Marty Friedman and drummer Nick Menza, the line-up fans call the classic one. Before hiring Friedman, Mustaine tried out many guitarists, including Dimebag Darrell of Pantera, who turned the job down because his brother couldn’t join too.","The title came from a bumper sticker Mustaine saw on the drive home: “May all your nuclear weapons rust in peace”.","The lyrics take on religion, politics and war, UFO conspiracies, Marvel’s Punisher and Mustaine’s own fight with drugs and alcohol. Ed Repka’s cover shows the band’s mascot Vic Rattlehead and world leaders of the day looking at an alien body."],
reception:"It went platinum in the US in 1994 and was nominated for the Grammy for Best Metal Performance. Decibel called it genre-defining, Kerrang! said it set a new standard for 1990s metal, and it is often named among the best thrash albums ever made.",
collabs:[["Mike Clink","Producer"],["Max Norman","Mixing"],["Micajah Ryan","Engineer"],["Ed Repka","Cover art"]],
echo:[["Return to Hangar","Megadeth"]],
songs:["Inspired by the Northern Ireland conflict and by Marvel’s Punisher, after a gig in Antrim where a dedication from Mustaine sparked a riot. It was the first single and became a live staple.","Nick Menza’s idea: a song about UFO conspiracies and Area 51, with twin guitar solos after the verse. It won Top Radio Cut at the 1991 Foundations Forum.","","","Started around the Peace Sells era and kept being reworked until it made this album.","","Its guitar solo is considered one of the greatest in heavy metal.","A short track with music by bassist David Ellefson.","About nuclear war; Polaris was a Cold War nuclear missile. Mustaine first wrote it as “Child Saint”, before his time in Metallica."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Rust_in_Peace">Wikipedia: Rust in Peace</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"vulgar-display-of-power":{
release:"February 1992",label:"Atco",
genres:{n:"Metal",c:[{n:"Groove metal"}]},cover:"assets/covers/vulgar-display-of-power.jpg",
rec:"Recorded in 1991 at Pantego Sound Studio in Pantego, Texas, with producer Terry Date, and mastered at Masterdisk in New York. Most of the songs were written in the studio with little demoing.",
tracks:[["Mouth for War","3:57"],["A New Level","3:57"],["Walk","5:14"],["Fucking Hostile","2:48"],["This Love","6:32"],["Rise","4:36"],["No Good (Attack the Radical)","4:49"],["Live in a Hole","5:00"],["Regular People (Conceit)","5:27"],["By Demons Be Driven","4:40"],["Hollow","5:48"]],
trackNote:"The 2012 20th-anniversary edition adds an unreleased track, “Piss”.",
making:["Pantera’s sixth album was their second with producer Terry Date. When Metallica’s 1991 self-titled album moved away from thrash, Pantera saw a gap and set out to make the heaviest record of all time.","Two months in, they flew to Moscow to open for Metallica and AC/DC at the 1991 Monsters of Rock concert, then went back to finish the album. During the sessions, guitarist Diamond Darrell became Dimebag Darrell.","The title is a line from the 1973 film The Exorcist. Brad Guice’s cover photo shows a man being punched in the face. Rumour said the model was hit dozens of times at $10 a punch, but Guice said he was never actually hit."],
reception:"It debuted at number 44 on the Billboard 200 and is Pantera’s best-selling album, certified double platinum in the US. AllMusic called it one of the most influential metal albums of the 1990s, and in 2017 Rolling Stone ranked it 10th among the greatest metal albums of all time.",
collabs:[["Terry Date","Producer"],["Brad Guice","Cover photograph"],["Sean Cross","Model on the cover"]],
echo:[["Walk","Avenged Sevenfold"],["Walk","Disturbed"],["Walk","Breaking Benjamin"]],
songs:["The first single and Pantera’s first song to chart anywhere, reaching number 73 in the UK.","One of three songs demoed before the sessions began.","Dimebag Darrell first played the riff at a soundcheck. Phil Anselmo’s lyrics answer friends back home who thought fame had gone to the band’s heads. It became their first UK top 40 hit.","Released as a promo single.","One of the album’s two ballads, praised by Entertainment Weekly for its tough edge.","","One of three songs demoed before the sessions began.","","One of three songs demoed before the sessions began.","Christian Bale learned to drum along to it for a scene in the 2015 film The Big Short.","The album’s second ballad, also released as a promo single."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Vulgar_Display_of_Power">Wikipedia: Vulgar Display of Power</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
