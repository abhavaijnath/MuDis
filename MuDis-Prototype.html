"blue-train":{
release:"January 1958",label:"Blue Note",
genres:{n:"Jazz",c:[{n:"Hard bop"}]},cover:"assets/covers/blue-train.jpg",
rec:"Recorded in a single day, September 15, 1957, at Rudy Van Gelder’s studio in Hackensack, New Jersey, with Van Gelder engineering and Alfred Lion producing.",
tracks:[["Blue Train","10:43"],["Moment’s Notice","9:10"],["Locomotion","7:14"],["I’m Old Fashioned","7:58"],["Lazy Bird","7:00"]],
trackNote:"All tracks by John Coltrane except “I’m Old Fashioned” (Jerome Kern and Johnny Mercer).",
making:["Blue Train is John Coltrane’s only album as leader for Blue Note. He made it while playing in Thelonious Monk’s quartet, bringing in his Miles Davis bandmates Paul Chambers and Philly Joe Jones, pianist Kenny Drew, and two rising players, trumpeter Lee Morgan and trombonist Curtis Fuller. Unusually, Blue Note paid the band to rehearse first.","Coltrane wrote four of the five tunes, a rarity in the 1950s. They use familiar harmonies in unexpected ways, and his solos already point toward his later style: built up from the chords, arpeggiated, and often floating apart from the beat.","The album stays within the hard bop style of its day; his next major record, Giant Steps, would break new ground. In 1960 Coltrane called Blue Train his favourite of his own albums so far."],
reception:"It went gold in the US in 2001 after selling more than half a million copies. Colin Larkin wrote that Coltrane may have made more important albums, but none swung as well as this one, and Blue Note’s Michael Cuscuna called it his first truly mature statement.",
collabs:[["Lee Morgan","Trumpet"],["Curtis Fuller","Trombone"],["Kenny Drew","Piano"],["Paul Chambers","Bass"],["Philly Joe Jones","Drums"],["Rudy Van Gelder","Engineer"]],
echo:[],
songs:["A bluesy piece with a haunting, minor-sounding theme. Michael Cuscuna called it one of the most beautiful things Coltrane recorded in the 1950s.","","Another blues riff tune, stretched to an unusual 44-bar form.","The one tune not by Coltrane: a standard by Jerome Kern and Johnny Mercer.","Its harmony is closely related to Tadd Dameron’s “Lady Bird”."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Blue_Train_(album)">Wikipedia: Blue Train (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"kind-of-blue":{
release:"August 1959",label:"Columbia",
genres:{n:"Jazz",c:[{n:"Modal jazz"}]},cover:"assets/covers/kind-of-blue.jpg",
rec:"Recorded on three-track tape in two sessions at Columbia’s 30th Street Studio in New York City, on March 2 and April 22, 1959, with producer Irving Townsend.",
tracks:[["So What","9:22"],["Freddie Freeloader","9:46"],["Blue in Green","5:27"],["All Blues","11:33"],["Flamenco Sketches","9:26"]],
trackNote:"Side one was recorded on March 2, side two on April 22.",
making:["Miles Davis had grown tired of bebop’s ever more complicated chord changes. Inspired by George Russell’s theory of scales, and by pianist Bill Evans, whom he called back for the sessions, he built a whole album on modes: each player got a set of scales to improvise on instead of a run of chords.","Davis barely rehearsed the band. He sketched the scales and melody lines only hours before, gave brief instructions and started taping. Contrary to legend it wasn’t all done in one take, but only “Flamenco Sketches” produced a complete take at the first attempt.","The sextet was Davis, John Coltrane, Cannonball Adderley, Bill Evans, Paul Chambers and Jimmy Cobb, with Wynton Kelly replacing Evans on the bluesy “Freddie Freeloader”. Every sideman went on to success of his own."],
reception:"Widely called the greatest jazz album ever recorded, it was certified five times platinum in the US in 2019. In 2002 it was among the very first recordings chosen for the National Recording Registry, and in 2009 the US House of Representatives passed a resolution honouring its 50th anniversary.",
collabs:[["John Coltrane","Tenor saxophone"],["Cannonball Adderley","Alto saxophone"],["Bill Evans","Piano"],["Wynton Kelly","Piano on “Freddie Freeloader”"],["Paul Chambers","Bass"],["Jimmy Cobb","Drums"]],
echo:[["In Memory of Elizabeth Reed","The Allman Brothers Band"],["Breathe","Pink Floyd"],["Blue","Mostly Other People Do the Killing"]],
songs:["Built on just two modes: sixteen bars of one, eight of another, then eight of the first again.","A standard twelve-bar blues, and the only track with Wynton Kelly on piano instead of Bill Evans.","A ten-bar cycle after a short introduction. Credited to Davis, but Bill Evans is widely believed to have written part or all of it, and the Davis estate acknowledged his authorship in 2002.","A twelve-bar blues in 6/8 time.","Built from five scales, each played for as long as the soloist wishes. It was the only piece to produce a complete take at the first try, though that take isn’t the one on the album."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Kind_of_Blue">Wikipedia: Kind of Blue</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"time-out":{
release:"December 1959",label:"Columbia",
genres:{n:"Jazz",c:[{n:"Cool jazz"},{n:"West Coast jazz"}]},cover:"assets/covers/time-out.jpg",
rec:"Recorded on June 25, July 1 and August 18, 1959, at Columbia’s 30th Street Studio in New York City, with producer Teo Macero.",
tracks:[["Blue Rondo à la Turk","6:44"],["Strange Meadow Lark","7:22"],["Take Five","5:24"],["Three to Get Ready","5:24"],["Kathy’s Waltz","4:48"],["Everybody’s Jumpin’","4:23"],["Pick Up Sticks","4:16"]],
trackNote:"All tracks by Dave Brubeck except “Strange Meadow Lark” (with Iola Brubeck) and “Take Five” (Paul Desmond).",
making:["Time Out is an experiment in unusual time signatures. Dave Brubeck got the idea on a US State Department tour, after hearing street musicians in Turkey play a folk song in 9/8, a rhythm rarely heard in Western music.","Columbia was wary. Its president, Goddard Lieberson, agreed to release it only if the quartet first recorded Gone with the Wind, a conventional album of songs from the American South.","The quartet was Brubeck on piano, Paul Desmond on alto saxophone, Eugene Wright on bass and Joe Morello on drums. Desmond wrote “Take Five”, the only tune not by Brubeck."],
reception:"It reached number two on the Billboard albums chart and became the first jazz album to sell a million copies; “Take Five” was the first jazz single to do the same. It went double platinum in 2011, joined the National Recording Registry in 2005 and entered the Grammy Hall of Fame in 2009.",
collabs:[["Paul Desmond","Alto saxophone; wrote “Take Five”"],["Eugene Wright","Bass"],["Joe Morello","Drums"],["Teo Macero","Producer"],["S. Neil Fujita","Cover artwork"]],
echo:[["All My Loving","The Beatles"]],
songs:["Opens in 9/8, split 2+2+2+3 like the Turkish rhythm the band heard on tour, though the solos move to 4/4. The title plays on Mozart’s “Rondo alla Turca”.","Starts with a piano solo in no clear time, then settles into a steady 4/4 swing once the band joins.","In 5/4 from start to finish. Desmond said it was never meant to be a hit, just a vehicle for a Joe Morello drum solo, yet it became the first jazz single to sell a million.","Begins as a waltz, then alternates two bars of 3/4 with two of 4/4.","Named after Brubeck’s daughter Cathy, but misspelled. It starts in 4/4, moves to double waltz time and finally combines the two. Writer Spencer Leigh suggested it may have inspired the Beatles’ “All My Loving”.","Mostly in a very flexible 6/4.","A clear, steady 6/4."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Time_Out_(Dave_Brubeck_Quartet_album)">Wikipedia: Time Out (Dave Brubeck Quartet album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"mingus-ah-um":{
release:"October 1959",label:"Columbia",
genres:{n:"Jazz",c:[{n:"Post-bop"},{n:"Hard bop"}]},cover:"assets/covers/mingus-ah-um.jpg",
rec:"Recorded on May 5 and 12, 1959, at Columbia’s 30th Street Studio in New York City, with producer Teo Macero.",
tracks:[["Better Git It in Your Soul","7:22"],["Goodbye Pork Pie Hat","5:44"],["Boogie Stop Shuffle","5:02"],["Self-Portrait in Three Colors","3:06"],["Open Letter to Duke","5:51"],["Bird Calls","6:17"],["Fables of Faubus","8:14"],["Pussy Cat Dues","9:14"],["Jelly Roll","6:17"]],
trackNote:"Lengths are the full versions. The original 1959 LP shortened six tracks to fit; the full takes came out in 1979.",
making:["Charles Mingus’s first album for Columbia is, in the words of The Penguin Guide to Jazz, an extended tribute to ancestors. Its tunes salute gospel preachers, Lester Young, Duke Ellington, Jelly Roll Morton and Charlie Parker.","The title is a joke on Latin lessons, where students recite adjective endings -us, -a, -um: Mingus, Minga, Mingum.","Producer Teo Macero trimmed six of the nine tracks for the original LP, both to fit the record and because he felt they worked better shorter. The cover is a painting by S. Neil Fujita."],
reception:"It was added to the National Recording Registry in 2003, entered the Grammy Hall of Fame in 2013, and ranked 380th on Rolling Stone’s 2020 list of the 500 greatest albums of all time.",
collabs:[["John Handy","Alto saxophone"],["Booker Ervin","Tenor saxophone"],["Shafi Hadi","Tenor and alto saxophone"],["Jimmy Knepper","Trombone"],["Horace Parlan","Piano"],["Dannie Richmond","Drums"],["S. Neil Fujita","Cover painting"]],
echo:[],
songs:["Inspired by the gospel singing and preaching Mingus heard as a child.","A tribute to saxophonist Lester Young, who died shortly before the album was recorded.","A twelve-bar blues with four themes over a boogie bass that switches between stop time and shuffle, just as the title says.","Written for John Cassavetes’ first film as director, Shadows, but left out for budget reasons.","A tribute to Duke Ellington that draws on three of Mingus’s earlier pieces.","Despite the title, Mingus said it wasn’t meant to sound like Charlie Parker, nicknamed Bird, but like actual birds, at least in its first part.","Named after Arkansas governor Orval Faubus, who opposed school integration in Little Rock in 1957. Columbia refused the protest lyrics, so it was recorded as an instrumental; a version with words came out in 1961.","","A nod to Jelly Roll Morton, with a quote from Sonny Rollins’ “Sonnymoon for Two” in Horace Parlan’s piano solo."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Mingus_Ah_Um">Wikipedia: Mingus Ah Um</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"a-love-supreme":{
release:"January 1965",label:"Impulse!",
genres:{n:"Jazz",c:[{n:"Modal jazz"},{n:"Post-bop"},{n:"Spiritual jazz"}]},cover:"assets/covers/a-love-supreme.jpg",
rec:"Recorded in a single session on December 9, 1964, at Van Gelder Studio in Englewood Cliffs, New Jersey, with producer Bob Thiele.",
tracks:[["Part 1: Acknowledgement","7:47"],["Part 2: Resolution","7:22"],["Part 3: Pursuance / Part 4: Psalm","17:53"]],
trackNote:"On the original LP, “Pursuance” and “Psalm” share side two as a single track. All music by John Coltrane.",
making:["A Love Supreme is a four-part suite by John Coltrane, recorded with his classic quartet: McCoy Tyner on piano, Jimmy Garrison on bass and Elvin Jones on drums. Coltrane plays tenor saxophone throughout.","It is often heard as a spiritual offering: a struggle for purity, a thank-you, and an acknowledgement that a musician’s talent comes from a higher power. A San Francisco church, the Saint John Coltrane African Orthodox Church, treats it as its central text.","The next day Coltrane recorded two more versions of the opening part with saxophonist Archie Shepp and a second bassist, Art Davis, but he preferred the quartet take with his chant."],
reception:"By 1970 it had sold about 500,000 copies, far beyond Coltrane’s usual 30,000, without ever entering the Billboard 200. It was nominated for a Grammy in 1966, ranked 47th on Rolling Stone’s 2003 list of the greatest albums, and entered the National Recording Registry in 2015.",
collabs:[["McCoy Tyner","Piano"],["Jimmy Garrison","Bass"],["Elvin Jones","Drums"],["Bob Thiele","Producer"]],
echo:[["Love Devotion Surrender","Carlos Santana and John McLaughlin"],["Angel of Harlem","U2"],["A Love Supreme","Will Downing"]],
songs:["Opens with a gong and cymbals before Garrison’s bass lays out a four-note motif. Coltrane repeats it 36 times in his solo, and it then becomes the chant “a love supreme”, sung by Coltrane himself and overdubbed 19 times.","","Ends with “Psalm”, which Coltrane called a musical narration: he plays the words of a devotional poem, printed in the liner notes, on his saxophone without speaking them. Some scholars hear it as a tribute to African-American preachers."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/A_Love_Supreme">Wikipedia: A Love Supreme</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"bitches-brew":{
release:"March 1970",label:"Columbia",
genres:{n:"Jazz",c:[{n:"Jazz fusion"},{n:"Jazz rock"},{n:"Avant-garde jazz"}]},cover:"assets/covers/bitches-brew.jpg",
rec:"Recorded over three days, August 19–21, 1969, at Columbia’s Studio B in New York City: all live, no overdubs, from 10 a.m. to 1 p.m. each day. Producer Teo Macero then edited and pieced the tracks together.",
tracks:[["Pharaoh’s Dance","20:07"],["Bitches Brew","27:00"],["Spanish Key","17:30"],["John McLaughlin","4:23"],["Miles Runs the Voodoo Down","14:03"],["Sanctuary","10:54"]],
trackNote:"A double album: one track each on sides one and two, two each on sides three and four.",
making:["Bitches Brew pushed further into the electric sound Miles Davis had begun on In a Silent Way. Influenced by rock and funk, he swapped traditional jazz rhythms for loose, rock-influenced grooves built on improvisation, with electric piano and guitar.","Davis gave his large band only musical sketches, a few chords, a tempo and a mood, and let them play whatever came to mind. On the quieter passages you can hear him giving cues and snapping his fingers.","The rhythm section was huge: two bassists, two or three drummers, two or three electric pianists and a percussionist, all at once. Afterwards Macero spliced, looped and treated the tapes, using the studio itself as an instrument."],
reception:"Sales started slowly, but it became Davis’s highest-charting album, reaching number 35 on the Billboard 200, and won a Grammy in 1971. It went platinum in 2003 and joined the National Recording Registry in 2025. Some purists hated it, but it is credited with defining and popularising jazz fusion.",
collabs:[["Wayne Shorter","Soprano saxophone"],["Chick Corea","Electric piano"],["Joe Zawinul","Wrote “Pharaoh’s Dance”"],["Dave Holland","Bass"],["Jack DeJohnette","Drums"],["Bennie Maupin","Bass clarinet"],["Teo Macero","Producer and editor"]],
echo:[["OK Computer","Radiohead"],["Head Hunters","Herbie Hancock"]],
songs:["Written by Joe Zawinul. It holds 19 edits, and its famous stop-start opening was built entirely in the studio from looped sections.","The first piece recorded, on August 19. It contains 15 edits and short tape loops, and you can hear Davis directing the band, even calling out “John” to cue a solo.","One of the new pieces Davis had been trying out with his touring band in 1969.","A short piece on which Davis himself doesn’t play.","The only track with no editing at all, heard exactly as it was played. Davis’s closing solo is especially fierce.","Written by Wayne Shorter, and another piece the band had played on tour before the sessions."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Bitches_Brew">Wikipedia: Bitches Brew</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"head-hunters":{
release:"October 1973",label:"Columbia",
genres:{n:"Jazz",c:[{n:"Jazz-funk"},{n:"Jazz fusion"},{n:"Funk rock"}]},cover:"assets/covers/head-hunters.png",
rec:"Recorded in evening sessions in September 1973 at Wally Heider Studios and Different Fur Trading Co. in San Francisco, produced by Herbie Hancock and David Rubinson.",
tracks:[["Chameleon","15:41"],["Watermelon Man","6:29"],["Sly","10:15"],["Vein Melter","9:09"]],
trackNote:"All tracks by Herbie Hancock except “Chameleon”, written with Paul Jackson, Harvey Mason and Bennie Maupin.",
making:["After three far-out albums with his Mwandishi sextet, Herbie Hancock wanted something lighter and more down to earth. He formed a new band, later known as the Headhunters: Bennie Maupin on woodwinds, Paul Jackson on bass, Harvey Mason on drums and Bill Summers on percussion.","Hancock played every synthesizer part himself and dropped guitar entirely in favour of the Hohner Clavinet, one of the album’s defining sounds. Jackson and Mason’s tight rhythm section gave it a relaxed funk feel that reached a much wider audience.","Victor Moscoso designed the cover, which shows Hancock in a mask based on the kple kple mask of the Baoulé people of Ivory Coast, surrounded by his bandmates."],
reception:"It crossed over to funk and rock listeners, reaching number 13 on the Billboard 200 and number 2 on the R&B albums chart, and was the best-selling jazz album ever until George Benson’s Breezin’ in 1976. It entered the National Recording Registry in 2008.",
collabs:[["Bennie Maupin","Saxophones, bass clarinet, flute"],["Paul Jackson","Bass guitar"],["Harvey Mason","Drums"],["Bill Summers","Percussion"],["David Rubinson","Co-producer"],["Victor Moscoso","Cover design"]],
echo:[],
songs:["Built on a famous bassline Hancock played on an ARP Odyssey synthesizer. An edited version was released as a single, backed with “Vein Melter”.","The only tune not written for the album: a reworking of Hancock’s 1962 hard bop hit. Bill Summers blows into a beer bottle to imitate the hindewho flute of the Mbuti people of Zaire, over heavy African percussion.","Dedicated to Sly Stone of Sly and the Family Stone.","A slow-burning closer led by Hancock on Rhodes piano and Maupin on bass clarinet."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Head_Hunters">Wikipedia: Head Hunters</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"the-harder-they-come":{
release:"July 1972",label:"Island",
genres:{n:"Reggae",c:[{n:"Rocksteady"},{n:"Ska"}]},cover:"assets/covers/the-harder-they-come.jpg",
rec:"Assembled from singles released in Jamaica between 1967 and 1972. Only the title track was recorded by Jimmy Cliff specially for the soundtrack.",
tracks:[["You Can Get It If You Really Want","2:40"],["Draw Your Brakes","2:57"],["Rivers of Babylon","4:16"],["Many Rivers to Cross","3:02"],["Sweet and Dandy","3:01"],["The Harder They Come","3:41"],["Johnny Too Bad","3:04"],["007 (Shanty Town)","2:43"],["Pressure Drop","3:44"],["Sitting in Limbo","4:57"],["You Can Get It If You Really Want","2:43"],["The Harder They Come","3:07"]],
trackNote:"A soundtrack by various artists. The last two tracks are a dub version and an alternate take of songs heard earlier.",
making:["This is the soundtrack to the 1972 film The Harder They Come, and its heart is the film’s star, reggae singer Jimmy Cliff. Only the title song was recorded for the film; three earlier Cliff songs were added alongside it.","Director and co-writer Perry Henzell filled the rest with Jamaican hit singles from 1967 to 1972 by singers he loved: the Melodians, the Slickers, the deejay Scotty, Desmond Dekker, and Toots and the Maytals.","Two songs return to close side two: a dub version of “You Can Get It If You Really Want” with most of the vocals stripped away, and an alternate take of the title song."],
reception:"One of the most successful reggae albums of its era, it introduced these singers to the world and, together with the film, helped reggae break out of Jamaica. Rolling Stone ranks it among the 500 greatest albums and in 2024 named it the third-greatest soundtrack ever; it joined the National Recording Registry in 2021.",
collabs:[["Perry Henzell","Director; chose the songs"],["Toots and the Maytals","“Sweet and Dandy”, “Pressure Drop”"],["The Melodians","“Rivers of Babylon”"],["Desmond Dekker","“007 (Shanty Town)”"],["The Slickers","“Johnny Too Bad”"],["Scotty","“Draw Your Brakes”"]],
echo:[],
songs:["Written and sung by Jimmy Cliff. A dub version returns near the end of the album.","Performed by the deejay Scotty.","Performed by the Melodians; written by Brent Dowe and James McNaughton.","Written and sung by Jimmy Cliff.","Performed by the Maytals; written by Frederick “Toots” Hibbert.","The title song, and the only track Cliff recorded specially for the soundtrack.","Performed by the Slickers.","Written and performed by Desmond Dekker.","Performed by the Maytals; written by Frederick “Toots” Hibbert.","Written by Jimmy Cliff and Guillermo Bright-Plummer, and sung by Cliff.","A dub version of the opening song, with most of the vocals removed.","An alternate take of the title song closes the album."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/The_Harder_They_Come_(soundtrack)">Wikipedia: The Harder They Come (soundtrack)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"catch-a-fire":{
release:"April 1973",label:"Island",
genres:{n:"Reggae",c:[{n:"Roots reggae"},{n:"Reggae rock"}]},cover:"assets/covers/catch-a-fire.jpg",
rec:"Recorded on eight-track tape between May and October 1972 at Dynamic Sound, Harry J’s and Randy’s in Kingston, then remixed with overdubs by Chris Blackwell at Island Studios in London.",
tracks:[["Concrete Jungle","4:13"],["Slave Driver","2:53"],["400 Years","2:45"],["Stop That Train","3:54"],["Baby We’ve Got a Date (Rock It Baby)","3:55"],["Stir It Up","5:33"],["Kinky Reggae","3:37"],["No More Trouble","3:58"],["Midnight Ravers","5:08"]],
trackNote:"All songs by Bob Marley except “400 Years” and “Stop That Train” (Peter Tosh).",
making:["Stranded in London after a dispute over a CBS contract, the Wailers had no money to get home. Their road manager sent them to Island Records’ Chris Blackwell, who advanced them £4,000 for an album; they used it to fly back to Jamaica and record it there.","Bob Marley wrote seven of the songs and Peter Tosh two, though the group wrote together. Back in London, Blackwell reworked the tapes and added overdubs, including guitar by Muscle Shoals session player Wayne Perkins. The lyrics deal with poverty and injustice toward Black people.","The first 20,000 copies came in a sleeve shaped like a Zippo lighter that opened on a hinge. Hand-riveting each one cost too much, so later pressings used a photo of Marley smoking instead."],
reception:"It peaked at only number 171 on the Billboard 200, but its tour of Britain and the US built real interest in the band. Critics now count it among the greatest reggae albums ever made, and Rolling Stone placed it 123rd among the 500 greatest albums in 2003.",
collabs:[["Peter Tosh","Vocals, guitar, keyboards; wrote two songs"],["Bunny Wailer","Backing vocals, bongos"],["Aston “Family Man” Barrett","Bass"],["Carlton Barrett","Drums"],["Chris Blackwell","Co-producer"],["Wayne Perkins","Guitar overdubs"]],
echo:[["Stir It Up","Johnny Nash"]],
songs:["Wayne Perkins added a guitar solo in London, ending in three octaves of feedback. Rolling Stone said it crackles with streetwise immediacy.","Links the injustices of the present to those of the past.","Written by Peter Tosh, proof, said Rolling Stone, that the Wailers weren’t a one-man show.","Also written by Peter Tosh.","Released as a single before the album, with slide guitar added by Wayne Perkins. It is close to an earlier Wailers recording, “Black Bitter”.","A love song rather than a political one, with Perkins’s wah-wah lead guitar. Johnny Nash’s cover reached number 12 in the US in 1973.","Rolling Stone heard it revelling in reggae’s good-time skanking.","",""],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Catch_a_Fire">Wikipedia: Catch a Fire</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"funky-kingston":{
release:"1973",label:"Dragon",
genres:{n:"Reggae"},cover:"assets/covers/funky-kingston.jpg",
rec:"Recorded in 1972 at Dynamic Sound Studios in Kingston, with further work at Island in London. Producer Chris Blackwell added little beyond horn overdubs by the Ghanaian band Sons of the Jungle.",
tracks:[["Sit Right Down","4:44"],["Pomps and Pride","4:30"],["Louie Louie","5:46"],["I Can’t Believe","3:29"],["Redemption Song","3:26"],["Daddy’s Home","5:05"],["Funky Kingston","4:54"],["It Was Written Down","3:04"]],
trackNote:"The original 1973 Jamaican and UK album. A different US album with the same title and cover came out in 1975 and kept only three of these songs.",
making:["Toots and the Maytals had been hitmakers in Jamaica throughout the 1960s and even named the genre with their single “Do the Reggay”. Yet when they made Funky Kingston, reggae was still barely known abroad; one 1973 review called it Jamaican rock’n’roll.","As he would with the Wailers a year later, producer Chris Blackwell shaped the group for an international audience, while keeping the record close to the real Jamaican sound. The title was his idea, borrowing the “funky” from the hit “Funky Nassau”.","The songs deal with working-class hardship and country life in Jamaica, and celebrate life anyway. Covers of Ike Turner, Shep and the Limelites and “Louie Louie” tip a hat to American rhythm and blues."],
reception:"Lester Bangs called it the most exciting and varied set of reggae tunes by a single artist yet released. The 1975 US version made Rolling Stone’s list of the 500 greatest albums, which described it as the quintessential record of Jamaica’s greatest act after Bob Marley.",
collabs:[["Chris Blackwell","Producer"],["Sons of the Jungle","Horn overdubs"]],
echo:[],
songs:["","","A reggae take on Richard Berry’s rock’n’roll classic. This version later turned up in the Coen Brothers’ first film, Blood Simple.","A cover of an Ike Turner song.","","A cover of the Shep and the Limelites song.","The title track, later heard in the video game Grand Theft Auto: San Andreas and as the theme of the TV show Miami Ink.",""],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Funky_Kingston">Wikipedia: Funky Kingston</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"marcus-garvey":{
release:"December 1975",label:"Island",
genres:{n:"Reggae",c:[{n:"Roots reggae"}]},cover:"assets/covers/marcus-garvey.jpg",

tracks:[["Marcus Garvey","3:27"],["Slavery Days","3:34"],["The Invasion","3:22"],["Live Good","3:14"],["Give Me","3:11"],["Old Marcus Garvey","4:03"],["Tradition","3:30"],["Jordan River","3:00"],["Red, Gold & Green","3:14"],["Resting Place","3:10"]],

making:["Burning Spear’s third album is named after Marcus Garvey, Jamaican National Hero and a prophet of the Rastafari movement. It was his first record with producer Lawrence Lindo, who took his nickname, Jack Ruby, from the man who shot Lee Harvey Oswald.","Lindo and Spear reportedly worked out the opening song at their very first meeting. The backing band, which Lindo named the Black Disciples, was drawn from the Soul Syndicate and the Wailers.","Island thought the Jamaican mix too threatening, or too hard to sell, for white audiences and remixed it for release abroad, which outraged Burning Spear. A dub version, Garvey’s Ghost, followed four months later."],
reception:"Robert Christgau called it the most African-sounding and most political reggae album yet released in America. AllMusic counts it a landmark of roots reggae, though it regrets that Island’s remix diluted the haunting atmosphere of Jack Ruby’s original.",

"exodus":{
release:"June 1977",label:"Island",
genres:{n:"Reggae"},cover:"assets/covers/exodus.png",
rec:"Recorded in 1976 at Harry J. Studio in Kingston and from January to April 1977 at Island in London, where Marley had moved.",
tracks:[["Natural Mystic","3:28"],["So Much Things to Say","3:08"],["Guiltiness","3:19"],["The Heathen","2:32"],["Exodus","7:40"],["Jamming","3:31"],["Waiting in Vain","4:16"],["Turn Your Lights Down Low","3:39"],["Three Little Birds","3:00"],["One Love/People Get Ready","2:52"]],
trackNote:"All songs by Bob Marley.",
making:["In December 1976, gunmen attacked Bob Marley at his home in Jamaica, grazing his chest and hitting his arm; his wife Rita was shot too. Two days later he still played the Smile Jamaica concert, then left for London, where Exodus was recorded.","Marley had the album title before he wrote the song. Prime Minister Michael Manley’s election slogan, “We know where we’re going”, prompted him to write “Exodus” in reply.","Side one deals with religion and politics; side two turns to love and keeping faith. The sound is laid-back, with pulsing bass, piano, trumpet and guitar, and the lyrics are plainer than on earlier albums."],
reception:"It made Marley an international star, spending 56 weeks on the UK chart and going gold in the US, UK and Canada. In 1999 Time named it the best album of the 20th century, and more of its songs appear on the hits collection Legend than from any other Marley record.",
collabs:[["Aston “Family Man” Barrett","Bass"],["Carlton Barrett","Drums"],["Junior Marvin","Lead guitar"],["Tyrone Downie","Keyboards"],["The I Threes","Backing vocals: Rita Marley, Marcia Griffiths, Judy Mowatt"]],
echo:[],
songs:["A slow fade-in that opens the album’s religious and political first half.","Described by the BBC as exuberant, complete with a reggae scat.","One of two darker songs in the middle of side one.","The second of the two darker songs before the title track.","Marley’s reply to the government’s election slogan. It reached number one in Jamaica and number 14 in the UK.","One of the album’s major international hits, released as a single on 3 June 1977.","Another major international hit single.","","A major international hit, although it wasn’t released as a single until 1980.","Released as a single in 1984 and another international hit."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Exodus_(Bob_Marley_and_the_Wailers_album)">Wikipedia: Exodus (Bob Marley and the Wailers album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"thriller":{
release:"November 1982",label:"Epic",
genres:{n:"Pop",c:[{n:"Post-disco"},{n:"Synth-pop"}]},cover:"assets/covers/thriller.jpg",
rec:"Recorded from April 14 to November 8, 1982, at Westlake Recording Studios in Los Angeles, with producer Quincy Jones and a budget of $750,000.",
tracks:[["Wanna Be Startin’ Somethin’","6:03"],["Baby Be Mine","4:20"],["The Girl Is Mine","3:42"],["Thriller","5:58"],["Beat It","4:17"],["Billie Jean","4:57"],["Human Nature","4:06"],["P.Y.T. (Pretty Young Thing)","3:58"],["The Lady in My Life","5:00"]],
trackNote:"",
making:["Michael Jackson’s sixth album reunited him with Quincy Jones, producer of Off the Wall. Jackson felt that album had been undervalued and wanted to become the biggest star in show business. Together they worked on 30 songs and kept nine.","With a backlash against disco under way, Jackson moved toward post-disco and synth-pop, drawing on funk, rock, soul and soft ballads. He wrote four of the songs, dictating them into a recorder rather than writing them down, and members of Toto played on the sessions.","The first song recorded was “The Girl Is Mine” with Paul McCartney, the first featured artist credited on a Jackson album. The cover shows Jackson in a white suit; open the gatefold and a tiger cub appears at his leg."],
reception:"It spent a record 37 weeks at number one in the US and had become the best-selling album of all time by early 1984. Seven singles reached the top 10 and it won a record eight Grammys. Its videos helped turn music videos into an art form and opened MTV to Black artists.",
collabs:[["Quincy Jones","Producer"],["Paul McCartney","Duet on “The Girl Is Mine”"],["Toto","Members played on the sessions"],["Bruce Swedien","Won a Grammy for the album"],["Dick Zimmerman","Cover photograph"]],
echo:[],
songs:["Builds to an African-inspired chant, often taken for Swahili but actually based on Duala. AllMusic called it the album’s freshest funk, and also its most claustrophobic track.","One of the album’s disco songs.","A duet with Paul McCartney about two friends arguing over a woman, ending in a rap. Critics doubted it as the first single, but it reached number two in the US.","The title track. Its video premiered on MTV and sent the album’s sales soaring, though AllMusic was less keen on the song itself.","The fastest song on the album at 138 beats per minute, and a US number one. Its video cast around 80 real members of rival Los Angeles gangs, and it won Record of the Year.","Seven weeks at number one in the US and Jackson’s best-selling solo single. Its video, with pavement tiles lighting up under his feet, was one of the first by a Black artist in regular rotation on MTV.","One of the album’s soft ballads, and another top 10 hit.","A disco song, and another top 10 single.","A ballad that closes the album."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Thriller_(album)">Wikipedia: Thriller (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

genres:{n:"Pop",c:[{n:"Rock"},{n:"R&B"},{n:"Funk-pop"},{n:"Psychedelia"}]},cover:"assets/covers/purple-rain.jpg",
rec:"Mostly written and recorded between May 1983 and March 1984 in Minnesota, New York and Hollywood. The last three songs were recorded live at the Minneapolis club First Avenue on August 3, 1983, then edited and overdubbed.",
tracks:[["Let’s Go Crazy","4:39"],["Take Me with U","3:54"],["The Beautiful Ones","5:14"],["Computer Blue","3:59"],["Darling Nikki","4:14"],["When Doves Cry","5:52"],["I Would Die 4 U","2:59"],["Baby I’m a Star","4:24"],["Purple Rain","8:40"]],
trackNote:"",
making:["After the success of 1999, Prince told Warner Bros. they had to fund a film starring him, with a new album as its soundtrack, or he would leave. The label agreed to a $7 million budget, and this album became the soundtrack to that film.","Prince wrote more than 100 songs and chose nine. His band, the Revolution, newly expanded with guitarist Wendy Melvoin and keyboardist Lisa Coleman, helped shape music built from layers of guitars, keyboards, synthesizers and drum machines.","It is the most pop-oriented record of his career, yet it hints at the experiments to come. The lyrics of “Darling Nikki” upset Tipper Gore’s Parents Music Resource Center and helped bring about Parental Advisory stickers."],
reception:"It spent 24 straight weeks at number one in the US, and Prince joined Elvis Presley and the Beatles as the only artists to hold the number-one album, single and film at the same time. It has sold 13 million copies in the US, and Pitchfork named it the best album of the 1980s.",
collabs:[["The Revolution","Backing band"],["Wendy Melvoin","Guitar; helped write “Computer Blue”"],["Lisa Coleman","Keyboards; helped write “Computer Blue”"],["Doctor Fink","Keyboards; helped write “Computer Blue”"]],
echo:[],
songs:["The opener and Prince’s second US number one. The “De-elevator” in the lyrics is thought to stand for the Devil.","","","Grew out of a bass groove by keyboardist Doctor Fink, with Wendy Melvoin and Lisa Coleman helping to write it.","Its risqué lyrics drew complaints from Tipper Gore and helped lead to Parental Advisory stickers.","Prince’s first US number one, there for five weeks and top of Billboard’s year-end chart for 1984. TV executives thought his self-directed video too sexual.","Recorded live at First Avenue in 1983, and a US top 10 hit.","Dates back to 1981, and was also recorded live at First Avenue.","Recorded live at First Avenue, and a US top 10 hit. Prince explained the title as red blood in a blue sky at the end of the world, and being with the one you love as faith guides you through."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Purple_Rain_(album)">Wikipedia: Purple Rain (album)</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

genres:{n:"Pop",c:[{n:"Dance-pop"}]},cover:"assets/covers/like-a-prayer.jpg",
rec:"Recorded from September 1988 to January 1989, mostly at Johnny Yuma Recording in Burbank, with sessions at Saturn Sound, Ocean Way and Prince’s Paisley Park.",
tracks:[["Like a Prayer","5:41"],["Express Yourself","4:39"],["Love Song","4:52"],["Till Death Do Us Part","5:16"],["Promise to Try","4:21"],["Cherish","5:03"],["Dear Jessie","4:20"],["Oh Father","4:57"],["Keep It Together","5:03"],["Spanish Eyes","5:15"],["Act of Contrition","2:19"]],
trackNote:"",
making:["Madonna’s fourth album was her most personal yet. Turning 30, the age at which her mother had died, and divorcing Sean Penn, she wrote about subjects she had been afraid to touch: her Catholic upbringing, her marriage, her mother’s death and her father.","She worked again with Patrick Leonard and Stephen Bray, and Prince co-wrote and co-produced one track. For the first time she recorded in the same room as live musicians, often keeping first takes, which she felt made her singing more emotional and spontaneous.","It was her first studio album without her face on the cover: Herb Ritts photographed a close-up of her jeans and hands. Warner spent over $2 million promoting it, its most expensive campaign up to then."],
reception:"It topped the charts in 20 countries and sold more than 15 million copies. Critics praised its maturity, and it is seen as the moment Madonna began to be taken seriously as an artist rather than simply a pop star.",

tracks:[["Rehab","3:34"],["You Know I’m No Good","4:17"],["Me & Mr. Jones","2:33"],["Just Friends","3:13"],["Back to Black","4:01"],["Love Is a Losing Game","2:35"],["Tears Dry on Their Own","3:06"],["Wake Up Alone","3:42"],["Some Unholy War","2:22"],["He Can Only Hold Her","2:46"],["Addicted","2:45"]],
trackNote:"",
making:["Amy Winehouse’s second and final album grew out of her stormy relationship with Blake Fielder-Civil, who briefly left her for an ex-girlfriend. The songs deal with guilt, grief, infidelity and heartbreak.","Leaving the jazz of her debut, Frank, behind, she turned to the pop and soul of 1960s girl groups. Producers Salaam Remi and Mark Ronson, with Sharon Jones’s band the Dap-Kings, helped her capture that era while blending it with modern R&B.","Winehouse wrote most of the songs alone. She would burn her vocals to CD and play them in her father’s taxi to hear how ordinary listeners would hear them."],
reception:"It sold 20 million copies and is the UK’s second best-selling album of the 21st century. At the 2008 Grammys it won Best Pop Vocal Album, one of five awards Winehouse took that night. Its success opened doors for female artists such as Adele, Duffy and Florence and the Machine.",

songs:["Autobiographical: about refusing to go to rehab after talking it over with her father. It name-checks Ray Charles and Donny Hathaway, and won Record and Song of the Year at the Grammys.","Released as a single.","One of five songs recorded with Salaam Remi in Miami.","Another of the five Miami songs with Salaam Remi.","The title track, released as a single.","Released as a single.","Built on the chord progression of Marvin Gaye and Tammi Terrell’s “Ain’t No Mountain High Enough”, with Winehouse giving herself a stern talking-to. It was recorded with Salaam Remi in Miami.","Written with Paul O’Duffy; the first song from a month of sessions at his North London studio, and the only one to make the album.","Recorded with Salaam Remi in Miami.","","Recorded with Salaam Remi in Miami."],

making:["After her breakthrough with One of the Boys, Katy Perry chose to keep things firmly pop, saying the album would show whether she was meant to do this or had just got lucky. It deals with the whirlwind of her new fame, friendships and relationships.","She co-wrote the album with producers including Max Martin, Dr. Luke, Benny Blanco, Stargate and Greg Wells, moving on from the pop rock of her debut into disco, electronic, funk and house.","The album is named after its title song, which she wrote in her hometown of Santa Barbara and which, she said, gives off a euphoric feeling."],

trackNote:"Standard edition.",
making:["Named after the year she was born, as a symbolic rebirth, 1989 is the album where Taylor Swift left country for pop. She wanted something sonically cohesive and blatantly pop, believing that if you chase two rabbits, you lose them both.","Inspired by 1980s synth-pop, Annie Lennox and Peter Gabriel, she and producers including Max Martin, Shellback and Jack Antonoff swapped acoustic guitars for synthesizers, drum machines and processed backing vocals.","The songs follow the aftermath of a failed relationship, looking at heartbreak and recovery with wistful nostalgia rather than bitterness. Each CD came with a pack of Polaroid photos, a format popular in the 1980s."],

making:["Dua Lipa wanted a record that recalled the music of her childhood and her parents’ records, with a futuristic twist, hence the title, which replaced her first idea, Glass House. Inspired by Gwen Stefani, Madonna and Kylie Minogue, she pushed herself to make songs that could sit beside her favourite classic pop.","She recorded nearly 60 songs, mostly in a nine-month burst once she had the title, with producers including Jeff Bhasker, Ian Kirkpatrick and Stuart Price. The result mixes disco, dance-pop and synth-pop with funky bass and vocoder backing vocals.","It was due on 3 April 2020 but came out early after leaking two weeks before, making Lipa the first major pop star to release an album in lockdown. Hugo Comte’s cover shows her in a retro car under a blue moon."],

tracks:[["Like a Rolling Stone","6:13"],["Tombstone Blues","5:56"],["It Takes a Lot to Laugh, It Takes a Train to Cry","4:09"],["From a Buick 6","3:19"],["Ballad of a Thin Man","5:58"],["Queen Jane Approximately","5:31"],["Highway 61 Revisited","3:30"],["Just Like Tom Thumb’s Blues","5:32"],["Desolation Row","11:21"]],
trackNote:"",
making:["Exhausted after touring England in 1965, Bob Dylan considered quitting. Instead he poured 20 pages of verse into what became “Like a Rolling Stone”, and writing it restored his enthusiasm for making music.","Building on Bringing It All Back Home, he used a rock band on every track except the closing ballad, “Desolation Row”, moving further from his acoustic folk roots. He wrote much of the rest during a month at his new home in Woodstock.","The title is the highway that ran from his birthplace, Duluth, Minnesota, down through St. Louis, Memphis, New Orleans and the Mississippi Delta: the road of the country blues. Dylan said it always felt like it was in his blood."],
reception:"It reached number 3 in the US and number 4 in the UK and is counted among the greatest albums ever made; Rolling Stone ranked it fourth in 2003. Author Michael Gray argued that, in an important sense, the 1960s started with this album.",
collabs:[["Al Kooper","Organ"],["Michael Bloomfield","Lead guitar"],["Harvey Brooks","Bass"],["Tom Wilson","Producer"],["Bob Johnston","Producer"]],
echo:[],
songs:["Released ahead of the album, it pairs electric guitar, organ and a snarling voice in a song of resentment rather than romance. Al Kooper, who had never played electric organ before, improvised its famous organ riff.","A fast two-chord blues driven by Michael Bloomfield’s guitar, parading characters from Belle Starr to Jack the Ripper and Ma Rainey through an absurd picture of America.","Dylan reworked it at the piano while the band took a lunch break, slowing it into what critic Sean Egan called a tender, sensual anthem.","A raucous up-tempo blues, partly based on Sleepy John Estes’ “Milk Cow Blues”.","Driven by Dylan’s piano against Al Kooper’s spooky organ, it looks at a media that can’t understand the singer or his work.","Close in spirit to “Like a Rolling Stone”, but with a touch of sympathy in place of mockery.","Opens with God telling Abraham to kill him a son; Abraham was also the name of Dylan’s father.","Six verses and no chorus, describing a nightmarish stay in Juárez, Mexico, before heading back to New York.","The 11-minute ballad that closes the album, and the only track without the rock band."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Highway_61_Revisited">Wikipedia: Highway 61 Revisited</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"sgt-pepper-s-lonely-hearts-club-band":{
release:"May 1967",label:"Parlophone",
genres:{n:"Rock",c:[{n:"Psychedelia"},{n:"Art rock"},{n:"Pop"}]},cover:"assets/covers/sgt-pepper-s-lonely-hearts-club-band.jpg",
rec:"Recorded from 6 December 1966 to 21 April 1967 at EMI Studios (now Abbey Road) and Regent Sound in London, on four-track tape, with producer George Martin and engineer Geoff Emerick.",
tracks:[["Sgt. Pepper’s Lonely Hearts Club Band","2:00"],["With a Little Help from My Friends","2:42"],["Lucy in the Sky with Diamonds","3:28"],["Getting Better","2:48"],["Fixing a Hole","2:36"],["She’s Leaving Home","3:25"],["Being for the Benefit of Mr. Kite!","2:37"],["Within You Without You","5:05"],["When I’m Sixty-Four","2:37"],["Lovely Rita","2:42"],["Good Morning Good Morning","2:42"],["Sgt. Pepper’s Lonely Hearts Club Band (Reprise)","1:18"],["A Day in the Life","5:38"]],
trackNote:"",
making:["Having quit touring in August 1966, the Beatles had time and an almost limitless budget. On a flight home, Paul McCartney came up with the idea of an Edwardian military band, and the group recorded as if they were that fictional band.","The sessions began with songs about their childhoods, but “Strawberry Fields Forever” and “Penny Lane” were released as a single and left off the album. What remained draws on vaudeville, circus, music hall, the avant-garde and Indian classical music, coloured by sound effects and tape tricks.","The cover, designed by pop artists Peter Blake and Jann Haworth, shows the band posing in front of a crowd of celebrities and historical figures."],
reception:"It spent 27 weeks at number one in the UK and 15 in the US, and in 1968 it became the first rock album to win the Grammy for Album of the Year. It joined the National Recording Registry in 2003 and, as of 2018, was the UK’s best-selling studio album.",
collabs:[["George Martin","Producer"],["Geoff Emerick","Engineer"],["Peter Blake","Cover design"],["Jann Haworth","Cover design"]],
echo:[],
songs:["Introduces the fictional band, and with it the idea behind the whole album.","Ringo Starr sings as the band’s fictional singer, Billy Shears, over the sound of screaming fans recorded at a Beatles concert at the Hollywood Bowl.","Many took the title as code for LSD, but John Lennon said it came from a drawing by his four-year-old son Julian. Its dreamlike mood owes something to Lewis Carroll’s Through the Looking-Glass.","During one session Lennon accidentally took LSD instead of an upper; George Martin, unaware, took him up to the roof for fresh air.","About McCartney letting his mind wander free of self-doubt. Its backing track was recorded at Regent Sound when EMI wasn’t available.","McCartney’s story of a young woman escaping her parents, inspired by a Daily Mail article about teenage runaways.","Lennon took the words from an 1843 poster for Pablo Fanque’s circus that he bought in an antique shop in Kent.","George Harrison insisted its message had nothing to do with pills or LSD.","A song aimed chiefly at parents, borrowing from English music hall and the style of George Formby.","Inspired by McCartney learning the American term for a female traffic warden: meter maid.","Lennon adapted its refrain from a Kellogg’s Corn Flakes TV jingle.","Added after road manager Neil Aspinall suggested the fictional band should reappear near the end. All four Beatles sing it.","The finale: Lennon’s verses, a separate middle section and two rising orchestral crescendos. One musicologist called it one of the most harrowing songs ever written."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Sgt._Pepper%27s_Lonely_Hearts_Club_Band">Wikipedia: Sgt. Pepper’s Lonely Hearts Club Band</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"led-zeppelin-iv":{
release:"November 1971",label:"Atlantic",
genres:{n:"Rock",c:[{n:"Hard rock"},{n:"Blues rock"},{n:"Folk"}]},cover:"assets/covers/led-zeppelin-iv.jpg",
rec:"Recorded from December 1970 to February 1971, mostly at Headley Grange, a country house in Hampshire, using the Rolling Stones Mobile Studio, with further sessions at Island in London and Sunset Sound in Los Angeles. Jimmy Page produced.",
tracks:[["Black Dog","4:55"],["Rock and Roll","3:40"],["The Battle of Evermore","5:51"],["Stairway to Heaven","8:02"],["Misty Mountain Hop","4:38"],["Four Sticks","4:45"],["Going to California","3:32"],["When the Levee Breaks","7:08"]],
trackNote:"Officially untitled: the sleeve shows four symbols, one chosen by each band member.",
making:["After the lukewarm reviews of Led Zeppelin III, the band left their fourth album untitled and put no name on the cover, just four symbols, one chosen by each member. Atlantic objected, but the band refused to hand over the tapes until it agreed.","They wrote at Bron-Yr-Aur in Wales and recorded mostly in Headley Grange, where the relaxed setting let them try out different arrangements and styles.","For the first time, guests joined them: Fairport Convention’s Sandy Denny on “The Battle of Evermore” and pianist Ian Stewart on “Rock and Roll”."],
reception:"It reached number one in the UK and number two in the US, and is Led Zeppelin’s best-selling album, with more than 37 million copies sold worldwide. Critics regularly place it among the greatest albums of all time.",
collabs:[["Jimmy Page","Producer"],["Sandy Denny","Vocals on “The Battle of Evermore”"],["Ian Stewart","Piano on “Rock and Roll”"]],
echo:[],
songs:["Named after a dog that hung around Headley Grange. Page and John Paul Jones wrote the riff, and its a cappella section was influenced by Fleetwood Mac’s “Oh Well”.","Came out of a jam with Ian Stewart; John Bonham’s intro grew from Little Richard’s “Keep A-Knockin’”.","Written by Page on a mandolin borrowed from Jones. Sandy Denny duets with Robert Plant: the only female voice ever heard on a Led Zeppelin recording.","The band’s best-known recording. Page wrote most of the music, and Plant wrote the lyrics at Headley Grange about a woman who took everything without giving anything back.","Plant’s lyrics deal with clashes between students and police over drugs; the title comes from Tolkien’s The Hobbit.","Named for Bonham playing its drum pattern with four sticks at once. It took many takes to get right.","A quiet acoustic song about Californian earthquakes and searching for the perfect woman, inspired by Joni Mitchell.","A reworking of a 1929 blues by Memphis Minnie and Kansas Joe McCoy. Bonham’s huge opening drums were recorded in Headley Grange’s stairwell, with microphones hung above the stairs."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Led_Zeppelin_IV">Wikipedia: Led Zeppelin IV</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},
"the-dark-side-of-the-moon":{
release:"March 1973",label:"Harvest / Capitol",
genres:{n:"Rock",c:[{n:"Progressive rock"},{n:"Psychedelic rock"}]},cover:"assets/covers/the-dark-side-of-the-moon.png",
rec:"Recorded in about 60 days between 31 May 1972 and 9 February 1973 at EMI Studios (now Abbey Road) in London, with engineer Alan Parsons.",
tracks:[["Speak to Me","1:05"],["Breathe (In the Air)","2:49"],["On the Run","3:45"],["Time","6:53"],["The Great Gig in the Sky","4:47"],["Money","6:22"],["Us and Them","7:49"],["Any Colour You Like","3:26"],["Brain Damage","3:46"],["Eclipse","2:12"]],
trackNote:"",
making:["Bassist Roger Waters pitched an album about the things that “make people mad”: the pressures of the band’s life on the road, and the mental health problems of former member Syd Barrett. Pink Floyd developed it on stage before recording it.","They dropped the long instrumentals of their earlier work and built the record with multitrack recording, tape loops and analogue synthesizers. Snippets of interviews with their road crew and others run between the songs.","Storm Thorgerson designed the sleeve, a prism splitting light into a spectrum, after keyboardist Richard Wright asked for something simple and bold."],
reception:"By 2013 it had sold over 45 million copies, making it the best-selling album of the 1970s and the fourth best-selling album in history. It has spent close to 1,000 weeks on the Billboard 200.",
collabs:[["Alan Parsons","Engineer"],["Clare Torry","Vocals on “The Great Gig in the Sky”"],["Dick Parry","Saxophone"],["Storm Thorgerson","Cover design"]],
echo:[],
songs:["An overture of cross-faded sounds from the rest of the album. Drummer Nick Mason received a rare solo writing credit for it.","Comes from an earlier piece by Roger Waters and Ron Geesin. With “Speak to Me”, it sets out life’s mundane routine under the constant threat of madness.","A synthesizer-driven instrumental set in an airport, evoking the stress of travel. An engineer running round the studio’s echo chamber is part of the sound.","Still a radio favourite decades later, played almost as often as “Money” on US radio.","Session singer Clare Torry, brought in by Alan Parsons, provides its wordless vocal.","Opens with a loop of clinking coins, tearing paper, a cash register and an adding machine. It reached number 13 in the US and became the band’s most successful track.","Built on “The Violent Sequence”, a piece Richard Wright wrote for the film Zabriskie Point. It deals with war, materialism and depression, with saxophone by Dick Parry.","About the illusion of choice in society.","About mental illness brought on by putting fame above the self; its line about the band playing different tunes reflects Syd Barrett’s breakdown.","The closing song, with female backing vocals."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/The_Dark_Side_of_the_Moon">Wikipedia: The Dark Side of the Moon</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"never-mind-the-bollocks":{
release:"October 1977",label:"Virgin",
genres:{n:"Rock",c:[{n:"Punk rock"},{n:"Hard rock"}]},cover:"assets/covers/never-mind-the-bollocks.jpg",
rec:"Recorded in October 1976 and from March to August 1977, mostly at Wessex Sound in London, with Chris Thomas and Bill Price producing.",
tracks:[["Holidays in the Sun","3:22"],["Liar","2:41"],["No Feelings","2:53"],["God Save the Queen","3:20"],["Problems","4:11"],["Seventeen","2:02"],["Anarchy in the U.K.","3:32"],["Bodies","3:03"],["Pretty Vacant","3:18"],["New York","3:07"],["E.M.I.","3:10"]],
trackNote:"Full title: Never Mind the Bollocks, Here’s the Sex Pistols.",
making:["The Sex Pistols’ only studio album was made amid chaos. Bassist Glen Matlock, co-writer of most of the songs, left early on; his replacement, Sid Vicious, couldn’t play well enough, so guitarist Steve Jones played bass on most tracks.","By the time it came out, the band had sworn on live TV, been fired by two record labels and been banned from playing in parts of Britain. EMI dropped them in January 1977 over the uproar around their first single.","It was first going to be called God Save Sex Pistols; Steve Jones supplied the final title, a phrase he picked up from two fans. Jamie Reid’s dayglo cover used cut-out lettering and no photo of the band, and many shops refused to stock it."],
reception:"Despite store bans, it entered the UK chart at number one on 125,000 advance orders. NME writers voted it the third-greatest album of all time in 1993, and Time named it one of the 100 greatest albums ever.",
collabs:[["Chris Thomas","Producer"],["Bill Price","Producer"],["Glen Matlock","Co-writer of most songs"],["Sid Vicious","Bass on two tracks"],["Jamie Reid","Cover design"]],
echo:[],
songs:["Released as the band’s fourth single, it reached number eight in the UK.","","","Recorded with Sid Vicious, though the producers gave up on using his bass part. Matlock reportedly left the band partly over its lyrics.","","An early song that closed the band’s live sets in 1975.","The band’s first single, released by EMI in November 1976. The controversy that followed got them dropped from the label.","The last song finished for the album. Sid Vicious’s bass is on it, low in the mix under a second part by Steve Jones.","The first song the band ever wrote.","",""],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Never_Mind_the_Bollocks,_Here%27s_the_Sex_Pistols">Wikipedia: Never Mind the Bollocks, Here’s the Sex Pistols</a>, available under CC BY-SA 4.0. Cover art from Spotify.'
},

genres:{n:"Rock",c:[{n:"Alternative rock",c:[{n:"Grunge"}]}]},cover:"assets/covers/nevermind.jpg",
rec:"Recorded in May 1991 at Sound City in Van Nuys, California, keeping one song from 1990 sessions at Smart Studios in Madison, Wisconsin. Butch Vig produced and Andy Wallace mixed it.",
tracks:[["Smells Like Teen Spirit","5:01"],["In Bloom","4:14"],["Come as You Are","3:39"],["Breed","3:03"],["Lithium","4:17"],["Polly","2:57"],["Territorial Pissings","2:22"],["Drain You","3:43"],["Lounge Act","2:36"],["Stay Away","3:32"],["On a Plain","3:16"],["Something in the Way","3:52"]],
trackNote:"Later copies end with a hidden track, “Endless, Nameless”, that was accidentally left off the first pressings.",
making:["Nirvana’s second album, and the first with drummer Dave Grohl, was first planned for Sub Pop under the working title Sheep. By then Kurt Cobain was writing more melodic songs, inspired by bands such as the Pixies, R.E.M. and Melvins.","Unhappy with Butch Vig’s first mixes, the band brought in Andy Wallace, chosen because the Slayer records he had worked on sounded so heavy. The result is far more polished and radio-friendly than their earlier work.","Cobain’s lyrics deal with alienation, anti-establishment and feminist ideas and relationships, more sensitive than most mainstream rock of the time. The cover shows a baby swimming underwater toward a dollar bill on a fishhook."],
reception:"An unexpected smash, it reached number one in the US in January 1992 and has sold more than 30 million copies worldwide. Critics voted it album of the year in the Pazz & Jop poll, and it joined the National Recording Registry in 2004.",
collabs:[["Butch Vig","Producer"],["Andy Wallace","Mixing"],["Dave Grohl","Drums"],["Krist Novoselic","Bass"]],
echo:[],
songs:["The lead single. It reached number 6 in the US and topped the critics’ polls for both single and video of the year.","A successful single, reaching number 28 in the UK.","The second single, reaching number 9 in the UK and number 32 in the US.","","Written before Cobain met Tobi Vail, then changed to reference her. It reached number 11 in the UK.","One of the album’s acoustic ballads, and the only recording kept from the 1990 Smart Studios sessions.","One of the album’s punk-influenced hard rock songs.","Its opening line quotes something Tobi Vail once said to Cobain.","","Originally called “Pay to Play”; another punk-influenced track.","","An acoustic ballad that closes the album."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Nevermind">Wikipedia: Nevermind</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

"is-this-it":{
release:"July 2001",label:"RCA / Rough Trade",
genres:{n:"Rock",c:[{n:"Indie rock"},{n:"Garage rock revival"},{n:"Post-punk revival"}]},cover:"assets/covers/is-this-it.png",
rec:"Recorded in March and April 2001 at Transporterraum in New York’s East Village with producer Gordon Raphael, after early sessions with Gil Norton sounded too clean.",
tracks:[["Is This It","2:31"],["The Modern Age","3:28"],["Soma","2:33"],["Barely Legal","3:54"],["Someday","3:03"],["Alone, Together","3:08"],["Last Nite","3:13"],["Hard to Explain","3:44"],["New York City Cops","3:31"],["Trying Your Luck","3:22"],["Take It or Leave It","3:16"]],
trackNote:"US CD copies replace “New York City Cops” with “When It Started”.",
making:["For their debut, the Strokes wanted a simple sound that the studio didn’t dress up. Every song was mixed using 11 or fewer tracks, with “no gimmicks, no tricks”, as guitarist Nick Valensi put it.","Julian Casablancas’s lyrics are about the lives and relationships of young people in New York City, set to twin guitars that interlock throughout the record.","After the September 11 attacks, the band pulled “New York City Cops” from the US CD in tribute to the city’s police, replacing it with a new song, “When It Started”."],
reception:"It reached number two in the UK and number 33 in the US, and critics praised its charisma and rhythm, which echoed 1970s garage rock. Its release is seen as a watershed moment in the reinvention of guitar music after the millennium.",
collabs:[["Gordon Raphael","Producer"],["Gil Norton","Early sessions, later scrapped"]],
echo:[],
songs:["The opener and one of the slowest songs: the Strokes’ attempt at a ballad, over a simple, metronomic drum line.","A rant about the oddness of modern life.","Named after the drug in Aldous Huxley’s Brave New World, about taking drugs to fit in. Its drums are processed to sound like a drum machine.","About a girl who has just reached the age of consent.","Mixes rockabilly with interlocking guitar lines; released as a single.","Driven by a staccato rhythm and peaking with a guitar solo.","A guitar-driven single that leans toward pop, with reggae-inspired rhythm guitar.","The first single, with drums processed to sound like a machine.","Opens with a yelp meant as a pastiche of Aerosmith. Removed from the US CD after September 11.","The album’s mellowest moment.","The only song on which guitarist Albert Hammond Jr. used the bridge pickup on his Stratocaster."],
src:'Text adapted from <a href="https://en.wikipedia.org/wiki/Is_This_It">Wikipedia: Is This It</a>, available under CC BY-SA 4.0. Cover art from Spotify.'

rec:"Recorded in 1987–1988 at Chung King and Greene Street in New York City, Sabella in Roslyn and Spectrum City in Hempstead, produced by Chuck D, Rick Rubin and Hank Shocklee.",
tracks:[["Countdown to Armageddon","1:40"],["Bring the Noise","3:46"],["Don’t Believe the Hype","5:19"],["Cold Lampin’ with Flavor","4:17"],["Terminator X to the Edge of Panic","4:31"],["Mind Terrorist","1:21"],["Louder Than a Bomb","3:37"],["Caught, Can We Get a Witness?","4:53"],["Show ’Em Whatcha Got","1:56"],["She Watch Channel Zero?!","3:49"],["Night of the Living Baseheads","3:14"],["Black Steel in the Hour of Chaos","6:23"],["Security of the First World","1:20"],["Rebel Without a Pause","5:02"],["Prophets of Rage","3:18"],["Party for Your Right to Fight","3:24"]],
trackNote:"",
making:["Public Enemy’s debut had sold only modestly, but their live shows were electric, so they made their second album faster to suit the stage. They also set out to make hip hop’s answer to Marvin Gaye’s What’s Going On, an album of sharp social commentary.","Their production team, the Bomb Squad, led by Hank Shocklee, built a dense, chaotic sound from found noise, free jazz and heavy funk. Chuck D called Shocklee the Phil Spector of hip hop: a Wall of Noise in place of a Wall of Sound.","Sessions began at Chung King in Manhattan, but the group ran into engineers who were prejudiced against hip hop acts and moved on to other studios."],
reception:"It reached number 42 on the Billboard 200, went platinum in 1989 and ran away with The Village Voice’s Pazz & Jop poll as the best album of 1988. In 2003 Rolling Stone ranked it 48th among the greatest albums, the highest of any hip hop record on the list.",
collabs:[["Hank Shocklee","Producer; led the Bomb Squad"],["The Bomb Squad","Production team"],["Eric Sadler","Bomb Squad musician"],["Rick Rubin","Producer"],["Flavor Flav","Drum machine on “Rebel Without a Pause”"]],

songs:["","Finished before the main sessions. A slip in the sampler left James Brown’s “Funky Drummer” kick playing on its own; Shocklee kept it, and Chuck D rewrote his rhyme to fit.","Another song completed before the main sessions began.","","","","","","","","","","","Shows off the faster tempo the group wanted, with screeching horns sampled from the J.B.’s. Flavor Flav played the beat on a drum machine for the full five minutes, and Chuck D wrote the lyrics in a single day.","",""],

trackNote:"",
making:["De La Soul’s debut was the first of three albums with producer Prince Paul, and the creative and commercial high point for both. The title borrows from Johnny Cash’s song “Five Feet High and Rising”.","Arriving at the height of gangsta rap, it stood apart with a playful, positive style that poked fun at the genre’s tough-guy clichés. Their mirth led many to call them a hippie group, a label they have always disputed.","The flower-covered sleeve was designed by Toby Mott of the British art collective the Grey Organisation. The group had originally pictured a cover showing an elevator halfway up, with just their faces."],
reception:"Critics loved it; Robert Christgau called it unlike any rap album anyone had ever heard. It joined the National Recording Registry in 2010 and ranked 103rd on Rolling Stone’s 500 greatest albums in 2020. Because of worries over its samples, it wasn’t available to buy digitally or stream until 2023.",

genres:{n:"Hip-hop",c:[{n:"Jazz rap"},{n:"Alternative hip-hop"},{n:"Boom bap"}]},cover:"assets/covers/the-low-end-theory.jpg",
rec:"Recorded mostly at Battery Studios in New York from 1990 to 1991, on a Neve console once used by John Lennon. Q-Tip produced most of it.",
tracks:[["Excursions","3:55"],["Buggin’ Out","3:37"],["Rap Promoter","2:13"],["Butter","3:39"],["Verses from the Abstract","3:59"],["Show Business","3:53"],["Vibes and Stuff","4:18"],["The Infamous Date Rape","2:54"],["Check the Rhime","3:37"],["Everything Is Fair","2:58"],["Jazz (We’ve Got)","4:10"],["Skypager","2:12"],["What?","2:29"],["Scenario","4:10"]],
trackNote:"",
making:["A month after A Tribe Called Quest’s debut came out, Phife Dawg learned he had diabetes and thought about leaving. Instead he and Q-Tip agreed he would take a bigger role, and the whole group would step it up.","Q-Tip’s production is minimal, stripped to vocals, drums and bass, and fused with the laid-back feel of bebop and hard bop jazz. He said the bottom-heavy sound of N.W.A’s Straight Outta Compton inspired it. Ali Shaheed Muhammad added scratching and co-production.","A line about shady record company people, from “Check the Rhime”, became one of the most quoted in hip hop, and the album has been called the Sgt. Pepper’s of hip hop."],
reception:"Critics and Jive executives doubted its sales at first, but the singles “Jazz (We’ve Got)” and “Scenario” built its popularity and it went gold in 1992. It is seen as a milestone of alternative hip hop, ranked 43rd among Rolling Stone’s greatest albums in 2020, and joined the National Recording Registry in 2022.",
collabs:[["Ali Shaheed Muhammad","DJ, co-production"],["Skeff Anselm","Produced two songs"],["Ron Carter","Double bass"],["Leaders of the New School","Featured on “Scenario”"],["Busta Rhymes","Verse on “Scenario”"]],

making:["Dr. Dre’s first solo album came after he left N.W.A and Ruthless Records in a dispute over money, and it takes shots at Ruthless and its owner, Eazy-E. The title comes from a slang term for high-grade cannabis.","Here Dre created his trademark G-funk sound: fat, laid-back Parliament-Funkadelic grooves, soulful backing vocals, rolling live bass and whining synths. For years afterwards, AllMusic said, mainstream hip hop was hard to hear without his influence.","It also launched Snoop Dogg, then Snoop Doggy Dogg, and introduced Daz Dillinger, Kurupt, RBX and the group 213. Its violent and sexist lyrics drew controversy."],

making:["The Wu-Tang Clan grew out of a late-1980s group formed by cousins Robert Diggs, Gary Grice and Russell Jones. Their debut takes its title from martial arts films, starting with Enter the Dragon.","With almost no money, they recorded in a small, cheap studio, often with eight of the nine members crammed in at once. RZA’s rough equipment gave the album its dirty sound: hard, bass-heavy drums and eerie, echoing samples.","Almost every song has several rappers trading battle rhymes, full of humour and outsized tales of city life. Their first single, “Protect Ya Neck”, was paid for by charging each rapper $100 for a verse."],
reception:"Despite its raw, underground sound it reached number 41 on the Billboard 200 and went platinum by 1995. It set a blueprint for 1990s hardcore hip hop and helped bring New York rap back to the fore. Rolling Stone ranked it 27th among the greatest albums in 2020, and it joined the National Recording Registry in 2022.",

making:["As a teenager, Nas went from calling himself Kid Wave to Nasty Nas, and made his recorded debut on Main Source’s “Live at the Barbeque”. With help from MC Serch, he signed to Columbia.","His single “Halftime” made producers want to work with him; DJ Premier said it was as classic to him as anything in hip hop. Nas brought together some of New York’s finest producers for the album.","Only 20 when it came out, Nas tells detailed first-person stories of gang rivalry, poverty and the troubled life of an inner-city teenager."],

trackNote:"Credited to John Mayall with Eric Clapton.",
making:["After Eric Clapton joined John Mayall’s band, Mayall planned a live album to capture his solos, but the club recordings were too poor to use, so they went into the studio instead.","The band was Mayall on piano, organ, harmonica and most vocals, John McVie on bass, Hughie Flint on drums and Clapton on guitar, with horns added afterwards. The songs are mostly blues standards by Otis Rush, Freddie King and Robert Johnson, plus a few originals, each a showcase for Clapton.","Clapton played a 1960 Gibson Les Paul through an overdriven Marshall amplifier, a pairing that became iconic; the guitar was stolen later that year. Fans call it the Beano Album because he is reading The Beano comic on the cover, feeling uncooperative at the photo shoot."],

trackNote:"",
making:["Albert King signed with Stax in 1966 at 43, with little success behind him. Backed by the label’s house band, Booker T. & the M.G.’s, and the Memphis Horns, he recorded a run of singles that were then gathered into this album.","King was left-handed but played a right-handed Gibson Flying V without restringing it, pulling the strings down instead of pushing them up. That let him bend several strings at once and gave the album its sharp guitar sound.","Side one holds six short songs, all under three minutes; side two turns to longer, ballad-like pieces. The music mixes electric blues with soul and funk."],
reception:"It never charted, but three of its songs reached the R&B singles chart, and it is now hailed as a blues monument. It shaped Eric Clapton, Mike Bloomfield, Jimi Hendrix and Stevie Ray Vaughan, and has entered the Blues Hall of Fame, the Grammy Hall of Fame and the National Recording Registry.",

trackNote:"",
making:["Producer Marshall Chess wanted to bring Muddy Waters to a younger, rock-loving audience, so he made a psychedelic concept album, comparing it to David Bowie becoming Ziggy Stardust. Waters, who had played for many hippies, hoped it would reach them.","Chess gathered some of Chicago’s hottest jazz-rock players, including members of the psychedelic band Rotary Connection, and added wah-wah, fuzz, organ and saxophone. The word electric in the title is meant in the psychedelic sense; Waters had played electric guitar for years.","Waters struggled with it. He couldn’t play the songs live with his own band, and complained that you can’t play blues if you need big amplifiers and wah-wahs to make your guitar talk."],
reception:"It sold 150,000 copies in six weeks and was Waters’s first album on the Billboard 200, peaking at number 127. Among critics and blues purists, though, it remains his most polarising record.",

making:["After seeing Stevie Ray Vaughan and Double Trouble at the 1982 Montreux Jazz Festival, Jackson Browne offered them three days’ free use of his Los Angeles studio. The demo they made there reached John Hammond, who arranged a deal with Epic.","Bassist Tommy Shannon remembered a big warehouse with concrete floors, where the band set up in a circle and played like a live band. Vaughan used Browne’s Dumbleland Special amplifier for the first time, a key part of his trademark sound.","Vaughan wrote six of the ten songs. The album is named after its cover of “Texas Flood”, first recorded by Larry Davis in 1958."],
