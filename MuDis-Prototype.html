/* Layout: one shell (search, MuDis, Path Map, Note it) that swaps between the genre-column home (L00) and a genre page (L01). Colour darkens with trail depth, as in the original two files. Single look by choice: greys only. */
:root{--bg:#f3f3f1;--fg:#111;--gut:36px;--line:rgba(17,17,17,.3);color-scheme:light}

:root[data-level="4"]{--bg:#2c2c2b;--fg:#f3f3f1;--line:rgba(243,243,241,.3)}
:root[data-level="5"]{--bg:#0b0b0b;--fg:#f3f3f1;--line:rgba(243,243,241,.3)}

body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:"Nimbus Sans","Nimbus Sans L",Helvetica,"Helvetica Neue",Arial,sans-serif;line-height:1.5;transition:background .9s ease,color .9s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding:22px max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));position:relative;width:100%}

.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 16px;border:1px solid var(--fg);border-radius:99px;background:transparent;font-size:13px}
.search{width:min(260px,100%);justify-content:flex-start;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:13px}

.search:focus-within{outline:2px solid var(--fg);outline-offset:3px}

.panel.open{display:block}

/* Path Map page: headline, stats, pannable/zoomable trail tree, actions. Background stays the colour of the level you opened it from. */
.mkick{margin:34px 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}

  root.classList.add("intro");rail.scrollLeft=0;
  var r=bw.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;
  bw.style.transform="translate("+(vw/2-(r.left+r.width/2))+"px,"+(vh/2-(r.top+r.height/2))+"px) scale(1.5)";
  cards.forEach(function(c){
    var a=Math.random()*Math.PI*2,d=Math.max(vw,vh)*(.7+Math.random()*.5);
    c.style.transition="none";c.style.opacity="0";
    c.style.transform="translate("+Math.round(Math.cos(a)*d)+"px,"+Math.round(Math.sin(a)*d)+"px) rotate("+Math.round(Math.random()*80-40)+"deg)";
  });
  setTimeout(function(){wl.classList.add("gone")},900);
  setTimeout(function(){bw.style.transition="transform 1.1s cubic-bezier(.6,0,.2,1)";bw.style.transform=""},1400);
  setTimeout(function(){cards.forEach(function(c){
    var dl=Math.round(Math.random()*700)+"ms";
    c.style.transition="transform 1s cubic-bezier(.15,.75,.25,1) "+dl+",opacity .5s ease "+dl;
    c.style.opacity="";c.style.transform="";
  })},2300);
  setTimeout(function(){root.classList.remove("intro")},3500);
  setTimeout(function(){cards.forEach(function(c){c.style.transition=""});bw.style.transition="";wl.classList.remove("gone")},4500);
}
if(cur.view==="home"&&!rm)intro();
</script>
